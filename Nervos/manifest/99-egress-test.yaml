# ============================================================
# EGRESS DIAGNOSTIC v3 -- isolates the ONE variable that decides
# what to ask the network team for.
#
# WHAT v2 ESTABLISHED (results, 2026-08-21)
#   named:443            OPEN   (docker/liquify/polkachu/mcr)
#   8.8.8.8:443   raw    OPEN
#   1.1.1.1:443   raw    BLOCKED (8s drop)
#   seed-0.crypto.org:26656 by NAME   OPEN   <-- non-443 port works
#   ckb bootnodes raw:8114            BLOCKED (8s drop)
#   egress IP     13.86.34.113        real internet egress exists
#
#   Correction to v2's section 5: 168.63.129.16:80 BLOCKED is
#   NORMAL. AKS deliberately blocks pods from the Azure
#   wireserver/IMDS to stop credential theft. It is not evidence
#   of a NetworkPolicy and v2 was wrong to imply it was.
#
# INDEPENDENTLY VERIFIED, from an unrestricted network:
#   16.163.82.218:8114  OPEN      35.79.196.111:8114  OPEN
#   3.218.170.86:8114   OPEN      13.37.172.80:8114   OPEN
#   13.234.144.148:8114 OPEN
#   ...and :8115 CLOSED on all five.
#   => The bootnode list is NOT stale. Those hosts are up and
#      answering on 8114. Something between the pod and them is
#      dropping it. Expect the network team to ask this first;
#      the answer is "yes, verified, they are up".
#   => The bootnodes listen on 8114 ONLY. 8115 matters for
#      DISCOVERED peers, not for the cold start.
#
# THE REMAINING QUESTION -- two hypotheses, opposite asks
#
#   H-PORT: outbound TCP 8114 is blocked; raw IPs are fine.
#           (26656 works because someone opened it for Cronos)
#           ASK: "allow outbound TCP 8114+8115"  -- easy.
#
#   H-IP:   raw-IP egress is blocked; the firewall proxies DNS
#           and only allows addresses IT resolved. Dial by name
#           -> allowed. Dial a raw IP -> denied. This is Azure
#           Firewall's FQDN-in-network-rules / DNS-proxy mode.
#           ASK: L4 network rule to an INTERNET destination --
#           much bigger, and no FQDN rule can ever substitute,
#           because CKB dials IPs with no SNI and no Host header.
#
#   Both are consistent with everything v2 saw. They are told
#   apart by holding one variable fixed and moving the other:
#
#     BLOCK A  name held fixed, port varies  -> isolates PORT
#     BLOCK B  port held fixed, name vs IP   -> isolates IP
#     BLOCK C  IP held fixed, port varies    -> isolates PORT
#              on an IP we KNOW is reachable from the internet
#
#   BLOCK C is the decisive one. 16.163.82.218 answers on BOTH
#   443 and 8114 from an unrestricted network (verified above),
#   so from this pod:
#       443 OPEN + 8114 BLOCKED  -> H-PORT
#       both BLOCKED             -> H-IP
#
# NOTE: pinned with nodeName to the node ckb-0 actually runs on.
# v2 ran on ...vmss00000m while ckb-0 is on ...vmss00000p. Same
# pool, so almost certainly the same rules -- but "almost
# certainly" is how you waste a day. Update nodeName if ckb-0
# moves: kubectl get pod ckb-0 -n nervos -o wide
#
#   kubectl apply -f 99-egress-test.yaml
#   kubectl logs -n nervos ckb-egress-test -f
#   kubectl delete -f 99-egress-test.yaml
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: ckb-egress-test
  namespace: nervos
  labels:
    app: ckb-egress-test
spec:
  restartPolicy: Never
  nodeName: aks-aksnodepool-15306923-vmss00000p   # the node ckb-0 is on
  containers:
    - name: probe
      image: alpine:3.19
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: "10m", memory: "32Mi" }
        limits:   { memory: "64Mi" }
      command: ["/bin/sh", "-c"]
      args:
        - |
          try() {
            label="$1"; host="$2"; port="$3"
            s=$(date +%s)
            if nc -z -w 8 "$host" "$port" 2>/dev/null; then r="OPEN   "; else r="BLOCKED"; fi
            e=$(date +%s)
            printf '  %s  %-30s %ss  %s\n' "$r" "$host:$port" "$((e-s))" "$label"
          }

          # busybox nslookup prints the RESOLVER first, then the
          # answers. Take the last IPv4 that is not the resolver.
          resolve() {
            nslookup "$1" 2>/dev/null \
              | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' \
              | grep -v '^10\.' | grep -v '^172\.' | tail -1
          }

          echo "node: $(cat /etc/hostname)   (should match ckb-0's node)"
          echo ""

          echo "############ A. NAME FIXED, PORT VARIES ############"
          echo "# portquiz.net accepts a connection on EVERY port."
          echo "# Same hostname throughout, so any difference here is"
          echo "# purely the PORT."
          for p in 443 80 26656 8114 8115; do try "portquiz.net" portquiz.net "$p"; done

          echo ""
          echo "############ B. PORT FIXED, NAME vs RAW IP ############"
          echo "# seed-0.crypto.org:26656 was OPEN by name in v2."
          echo "# Same host, same port, dialled by its raw IP."
          SEED=$(resolve seed-0.crypto.org)
          echo "  seed-0.crypto.org resolves to: ${SEED:-<resolve failed>}"
          try "by NAME  " seed-0.crypto.org 26656
          [ -n "$SEED" ] && try "by RAW IP" "$SEED" 26656

          PQ=$(resolve portquiz.net)
          echo "  portquiz.net resolves to: ${PQ:-<resolve failed>}"
          try "by NAME  " portquiz.net 443
          [ -n "$PQ" ] && try "by RAW IP" "$PQ" 443

          echo ""
          echo "########## C. IP FIXED, PORT VARIES (DECISIVE) ##########"
          echo "# These bootnode IPs answer on BOTH 443 and 8114 from"
          echo "# an unrestricted network -- independently verified."
          echo "# So any difference below is this cluster's firewall,"
          echo "# not the remote host."
          for ip in 16.163.82.218 35.79.196.111 3.218.170.86; do
            try "bootnode :443 " "$ip" 443
            try "bootnode :8114" "$ip" 8114
          done

          echo ""
          echo "############ D. SANITY ############"
          try "known-good raw IP" 8.8.8.8 443
          try "known-good name"   gateway.liquify.com 443

          echo ""
          echo "############################################"
          echo "#                 VERDICT                  #"
          echo "############################################"
          echo "# Look at BLOCK C first. Same IP, two ports:"
          echo "#"
          echo "#   443 OPEN + 8114 BLOCKED"
          echo "#      -> H-PORT. Outbound TCP 8114 is blocked and"
          echo "#         raw IPs are otherwise fine. This is the"
          echo "#         EASY case. Ask for outbound TCP 8114+8115."
          echo "#         Cross-check: block A should show 8114/8115"
          echo "#         BLOCKED while 443/80/26656 are OPEN."
          echo "#"
          echo "#   BOTH BLOCKED"
          echo "#      -> H-IP. Raw-IP egress is denied; only names"
          echo "#         the firewall resolved itself are allowed."
          echo "#         Confirm with block B: name OPEN + raw IP"
          echo "#         BLOCKED on the SAME host/port proves it."
          echo "#         Ask for an L4 network rule to an INTERNET"
          echo "#         destination on 8114+8115. An FQDN rule"
          echo "#         CANNOT work -- CKB dials IPs with no SNI."
          echo "#"
          echo "#   443 BLOCKED + 8114 OPEN"
          echo "#      -> unexpected; capture this output verbatim."
          echo "############################################"
          sleep 5
