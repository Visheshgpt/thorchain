# =============================================================================
# PARITY CONFIG -- this is Arweave/v1/docker-setup.md's config.json, on AKS.
#
# Source (their "Step 3: Create Configuration File"):
#
#     {
#         "peers": [
#             "asia.peers.arweave.xyz",
#             "europe.peers.arweave.xyz",
#             "india.peers.arweave.xyz",
#             "north-america.peers.arweave.xyz",
#             "oceania.peers.arweave.xyz",
#             "peers.arweave.xyz"
#         ],
#         "data_dir": "/data",
#         "vdf_server_trusted_peers": ["vdf-server-3.arweave.xyz"],
#         "transaction_blacklist_urls": ["https://public_shepherd.arweave.net"],
#         "mining_addr": "$WALLET_ADDR",
#         "sync_jobs": 20,
#         "port": 1984,
#         "mine": false
#     }
#
# Reproduced below key-for-key, value-for-value, with exactly TWO changes --
# both forced by AKS, both listed at the bottom of this file. Nothing else
# differs. No storage_modules, no header_sync_jobs, no disk-pool tuning.
#
# NODE TYPE: this is a Validator (the official term). It joins, validates
# blocks and transactions, serves the full HTTP API and GraphQL, and stores
# NO weave data. That is what their Docker node is, and this reproduces it.
#
# Their own /info output is the proof of what that means:
#     { "height": 1972319, "blocks": 208 }
# 208 block headers of 1.97 M, zero chunks. Expect the same numbers here --
# a low `blocks` count is CORRECT for this profile, not a fault.
#
# WARNING -- an unknown JSON key is FATAL. ar_config.erl ends its parser with
#   parse_options([Opt | _], _) -> {error, unknown, Opt}.
# One typo = CrashLoopBackOff. This is exactly their "Issue 3", where
# "mining" instead of "mine" produced:
#   Failed to parse config: unknown: {<<"mining">>,false}
# Treat the schema as closed.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: arweave-config
  namespace: arweave
  labels:
    app: arweave
    app.kubernetes.io/part-of: arweave-node
    arweave-profile: validator
data:
  config.json: |
    {
      "peers": [
        "asia.peers.arweave.xyz",
        "europe.peers.arweave.xyz",
        "india.peers.arweave.xyz",
        "north-america.peers.arweave.xyz",
        "oceania.peers.arweave.xyz",
        "peers.arweave.xyz"
      ],
      "data_dir": "/data",
      "log_dir": "/var/log/arweave",
      "vdf_server_trusted_peers": ["vdf-server-3.arweave.xyz"],
      "transaction_blacklist_urls": ["https://public_shepherd.arweave.net"],
      "sync_jobs": 20,
      "port": 1984,
      "mine": false
    }

# =============================================================================
# THE TWO DIVERGENCES FROM THEIR config.json -- and why each is unavoidable
# =============================================================================
#
# 1. ADDED  "log_dir": "/var/log/arweave"
#
#    Their container runs as root with a writable /opt/arweave, so Arweave's
#    default log_dir -- the RELATIVE path "logs", resolved against the release
#    directory after bin/arweave does `cd $ROOTDIR` -- lands in
#    /opt/arweave/logs and works fine.
#
#    This pod runs non-root with readOnlyRootFilesystem: true (Gatekeeper /
#    Azure Policy on this cluster forbids root containers). That relative
#    path is unwritable, and the node fails at startup. An absolute log_dir
#    onto a mounted emptyDir is the fix. Purely a filesystem-permissions
#    consequence; it changes no node behaviour.
#
# 2. REMOVED  "mining_addr": "$WALLET_ADDR"
#
#    Their setup generates an RSA wallet first and interpolates its address.
#    With "mine": false this value is INERT -- the node never reads the key
#    file, and set_mining_address/1 returns ok without touching it.
#
#    Omitting it means Arweave auto-creates a throwaway wallet in
#    /data/wallets on first boot, which persists on the PVC. Functionally
#    identical for a non-mining node, and it removes a manual pre-step.
#
#    A placeholder here would NOT be harmless: the address must be EXACTLY
#    43 characters (base64url of a 32-byte address) or it is a fatal parse
#    error. That is precisely what would have broken the v1 manifests, which
#    shipped the literal "REPLACE_WITH_WALLET_ADDRESS".
#
#    TO MATCH THEIR WALLET EXACTLY -- if you want this node to carry the same
#    mining address as the bare-metal one, add the key back with a REAL
#    address (see RUNBOOK section 5b for generating one):
#        "mining_addr": "<your-43-char-address>",
#    and place the keyfile at /data/wallets/arweave_keyfile_<address>.json.
#    NOTE their runbook renames the keyfile to /data/wallet.json and deletes
#    the wallets/ directory -- do NOT copy that. Arweave looks for
#    [data_dir]/wallets/arweave_keyfile_[address].json and nowhere else. It
#    is invisible while mine=false, and breaks the moment mining is enabled.
#
# =============================================================================
# WHAT IS *NOT* HERE, ON PURPOSE (all present in the archive profile)
# =============================================================================
#
#   storage_modules            -- absent, exactly as in theirs. This is the
#                                 single key that separates a Validator from
#                                 an archive. Adding it is what costs
#                                 terabytes. See ../manifests-archive/.
#   header_sync_jobs           -- absent -> default 1, as theirs. This is why
#                                 `blocks` climbs slowly.
#   max_disk_pool_buffer_mb    -- absent -> default 100000 (100 GB cap), as
#                                 theirs. Sized the data PVC accordingly.
#   enable randomx_large_pages -- absent, as theirs. Every official sample
#                                 config has it; it needs vm.nr_hugepages on
#                                 the host, which you cannot set on AKS
#                                 without a privileged DaemonSet. Their
#                                 bare-metal node sets it via sysctl; we
#                                 cannot and do not need to. Without the flag
#                                 RandomX uses normal pages and works.
#   start_from_latest_state    -- absent. Their runbook recommends it for
#                                 "Issue 4", but on an EMPTY data_dir the
#                                 node exits 1 ("The local state is empty...")
#                                 = permanent CrashLoopBackOff on a fresh PVC.
#                                 Manual recovery step only, never config.
#
# Changing this ConfigMap does NOT restart the pod, and Arweave reads config
# only at boot. Always follow an edit with:
#   kubectl rollout restart statefulset/arweave -n arweave
