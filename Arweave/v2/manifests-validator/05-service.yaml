# =============================================================================
# Services.
#
# Arweave uses ONE port for everything -- REST API, peer gossip, chunk sync,
# VDF, and Prometheus metrics all on 1984. So unlike the Cosmos nodes on this
# cluster there is no "p2p service vs rpc service" split to make. The only
# real decision is whether the node is reachable from the public internet.
#
# INBOUND REACHABILITY -- what it actually buys you:
#   Docs: "In order for your node to participate it needs to be accessible to
#   the internet so that peers can connect with your node and share their
#   blocks ... If the node is not accessible on the Internet, the miner
#   functions but is significantly less efficient."
#   And the documented fallback: "all nodes will also poll (i.e. make an
#   outbound HTTP request) a random subset of their peers to ask for new
#   blocks."
#
#   So: a node with outbound-only connectivity WORKS. It joins, it syncs
#   chunks, it validates. It is just slower to learn about new blocks and it
#   cannot serve data back to the network.
#
#   For an archive node whose job is to HOLD data and serve YOUR
#   applications, outbound-only is a perfectly reasonable posture, and it is
#   what this file ships by default -- matching the internal-LB pattern
#   already used by mantra (10.202.17.x) and thornode on this cluster.
#
#   If you want full participation, uncomment the public LoadBalancer at the
#   bottom AND open the NSG. Do BOTH or neither: a node that advertises an
#   address peers cannot dial gets deprioritised and dropped, which is worse
#   than advertising nothing. (This is the same mistake the thornode v1
#   runbook made with an RFC1918 EXTERNAL_IP -- see manifests-v2/05-service
#   for that write-up.)
# =============================================================================
---
# -- Headless: stable DNS identity, required by the StatefulSet ---------------
# publishNotReadyAddresses keeps arweave-0 resolvable while it is still
# joining. Readiness is gated on /recent, which 503s until the node has
# joined the network -- that is a 5-15 minute window on first boot, and much
# longer if peers are slow. Without this flag the pod has no DNS name during
# that window.
apiVersion: v1
kind: Service
metadata:
  name: arweave-headless
  namespace: arweave
  labels:
    app: arweave
    app.kubernetes.io/part-of: arweave-node
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: arweave
  ports:
    - { name: http, port: 1984, targetPort: 1984, protocol: TCP }

---
# -- ClusterIP: for apps INSIDE the cluster ----------------------------------
# Use this rather than the headless service from in-cluster consumers: it
# only routes once readiness passes, so callers never hit a node that has not
# joined and would answer 503.
#   http://arweave.arweave.svc.cluster.local:1984/info
apiVersion: v1
kind: Service
metadata:
  name: arweave
  namespace: arweave
  labels:
    app: arweave
    app.kubernetes.io/part-of: arweave-node
spec:
  type: ClusterIP
  selector:
    app: arweave
  ports:
    - { name: http, port: 1984, targetPort: 1984, protocol: TCP }

---
# -- Internal LoadBalancer: private VNet IP for consumers OFF-cluster --------
# Same pattern as mantra's 10.202.17.214/215. Gives you a stable RFC1918
# address on the VNet for dashboards, indexers, and the jumpbox.
#
# This is API access ONLY. It does NOT help peering -- Arweave peers are on
# the public internet and cannot route to an RFC1918 address.
#
# Delete this section if nothing outside the cluster needs the node.
#
# PORT 8000 -- their docker run uses `-p 8000:1984`, added for their
# "Issue 8: External Access Fails with ECONNRESET": the corporate network
# blocks 1984, so they remapped to an already-allowed port.
#
# If that same restriction applies to whoever consumes this node, change
# `port` below to 8000 and leave `targetPort` at 1984:
#     - { name: http, port: 8000, targetPort: 1984, protocol: TCP }
# The pod keeps listening on 1984; only the LB frontend moves. Remember to
# update the curl commands in the RUNBOOK to match.
#
# Safe to do here because this is an API-only path. It would NOT be safe on
# the public peering LB below -- the node advertises its CONFIGURED port
# (1984) to the network, so a remapped frontend would advertise an address
# that does not answer.
apiVersion: v1
kind: Service
metadata:
  name: arweave-internal
  namespace: arweave
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  labels:
    app: arweave
    app.kubernetes.io/part-of: arweave-node
spec:
  type: LoadBalancer
  selector:
    app: arweave
  ports:
    - { name: http, port: 1984, targetPort: 1984, protocol: TCP }

# =============================================================================
# -- OPTIONAL: public LoadBalancer for full network participation ------------
#
# Uncomment this AND add the NSG rule below. Both, or neither.
#
# Consequences of enabling it, in plain terms:
#   + Peers can dial you, so you learn about new blocks faster and you can
#     serve your archived weave data back to the network.
#   - Port 1984 is then open to the world. The node's own rate limiter
#     defaults to requests_per_minute_limit 900 per IP, which is the only
#     thing standing between you and the public. Consider narrowing
#     loadBalancerSourceRanges if you only need specific peers.
#   - It provisions a Public IP; confirm quota in the AKS node resource
#     group first (RUNBOOK section 9, issue 5).
#
# NSG rule required on the AKS node subnet -- without it you will see peers
# stuck near zero in /info even with the LB provisioned:
#   Inbound, Allow, TCP, port 1984, source Any (or your peer ranges),
#   destination = AKS node subnet.
#
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: arweave-public
#   namespace: arweave
#   labels:
#     app: arweave
#     app.kubernetes.io/part-of: arweave-node
# spec:
#   type: LoadBalancer
#   selector:
#     app: arweave
#   # The port peers connect to MUST equal the port in config.json (1984).
#   # The node advertises its configured port to the network, so a rewrite
#   # here would advertise an address that does not answer.
#   ports:
#     - { name: http, port: 1984, targetPort: 1984, protocol: TCP }
#   externalTrafficPolicy: Local   # preserves peer source IPs for rate limiting
#   # loadBalancerSourceRanges:
#   #   - 0.0.0.0/0
# =============================================================================
