# =============================================================================
# TWO PVCs for the no-ACR profile.
#
#   arweave-data -> /data          500Gi Premium SSD   (chain data, Retain)
#   arweave-bin  -> /opt/arweave     4Gi Standard SSD  (the release, Delete)
#
# The split is what makes this profile safe to operate:
#   - data_dir stays at /data, byte-identical to the team's docker setup
#     (`-v /1Disk73/arweave-docker/data:/data` + `"data_dir": "/data"`).
#   - The binary lives on its own volume, so it never pollutes data_dir. The
#     official docs warn: "There should be no overlap between the install
#     directory and your data_dir."
#   - Upgrades are a directory swap on a throwaway disk, not a mutation of
#     the volume holding your chain state.
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arweave-data
  namespace: arweave
  labels:
    app: arweave
    volume-role: data-dir
    arweave-profile: validator-noacr
    app.kubernetes.io/part-of: arweave-node
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: arweave-datadir
  resources:
    requests:
      # Their hardware table: "200 GB SSD minimum / 500+ GB NVMe recommended".
      # Also absorbs the disk pool, which defaults to a 100 GB cap
      # (max_disk_pool_buffer_mb 100000) and is left at default for parity.
      storage: 500Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arweave-bin
  namespace: arweave
  labels:
    app: arweave
    volume-role: binary
    arweave-profile: validator-noacr
    app.kubernetes.io/part-of: arweave-node
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: arweave-bin
  resources:
    requests:
      # The extracted release is ~250 MB. 4Gi because Azure bills StandardSSD
      # in tiers and E1 (4 GiB) is the smallest one -- asking for 1Gi costs
      # exactly the same. The headroom also lets a NEW version be downloaded
      # and extracted alongside the running one during an upgrade, before the
      # `current` symlink is flipped.
      storage: 4Gi

# =============================================================================
# CONTENTS OF /opt/arweave AFTER INIT
#
#   /opt/arweave/2.9.5.1/          <- extracted release (bin, lib, releases, erts-*)
#   /opt/arweave/current -> 2.9.5.1  <- symlink the StatefulSet actually runs
#
# The version-stamped directory plus the symlink is what makes upgrades work
# here. The broken pattern this profile replaces used a single unversioned
# path guarded by `if [ -f /data/app/bin/start ]` -- which meant changing the
# version in the manifest did NOTHING, because the guard saw the OLD binary
# and skipped. Upgrades were impossible without manually wiping the volume.
# See RUNBOOK section 12b.
# =============================================================================
