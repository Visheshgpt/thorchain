# ============================================================
# 02-pvc.yaml
# PersistentVolumeClaim — single /data volume
# StorageClass: arweave-storage | Size: 200Gi
# pvc-watcher will auto-expand at 80% up to 2000Gi
#
# UNCHANGED — this is the existing PVC, already applied.
# Re-applying it is a no-op. NOTHING NEW IS PROVISIONED.
#
# ── HOW THIS ONE DISK IS SHARED ─────────────────────────────
# The StatefulSet mounts this single claim TWICE, via subPath,
# so the Arweave install and the chain data never overlap:
#
#   arweave-data-pvc
#   ├── app/    -> mounted at /opt/arweave   (the release binary)
#   └── chain/  -> mounted at /data          (data_dir)
#
# The official docs are explicit: "There should be no overlap
# between the install directory and your data_dir." Two subPaths
# on one claim satisfies that without a second Azure Disk.
#
# ── SIZING NOTE ─────────────────────────────────────────────
# 200Gi sits right at the documented floor — Arweave docs say
# "The minimum recommended size for the data_dir is 256GB", and
# the team's own hardware table says "200 GB SSD minimum /
# 500+ GB NVMe recommended".
#
# It is workable here because this profile stores no weave data,
# and pvc-watcher auto-expands at 80%. Register it if you have
# not already (RUNBOOK section 10.2):
#   "arweave|arweave-node-0|/data|arweave-data-pvc|80|200|2000"
#
# Watch one thing: max_disk_pool_buffer_mb is left at its real
# default of 100000 (100 GB) for parity with the docker node.
# The disk pool only fills with chunks POSTed to this node, and
# nothing posts to it behind an internal LB — but on a 200Gi
# disk that default is half the volume. If /data ever climbs
# unexpectedly, cap it in the ConfigMap before growing the disk.
# ============================================================


apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arweave-data-pvc
  namespace: arweave
  labels:
    app: arweave-node
    environment: non-prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: arweave-storage
  resources:
    requests:
      # 64Gi — MINIMAL, sized for a proof-of-concept node that will be
      # torn down once syncing is demonstrated.
      #
      # The docs' "256GB minimum" assumes a node backfilling the full
      # header set and running for months. This one stores NO weave
      # data (no storage_modules) and backfills headers at the default
      # header_sync_jobs: 1 — the reference node sits at 208 blocks.
      # Actual consumption over a few weeks is single-digit GB:
      #   block index      ~172 MB
      #   block headers    ~1-2 KB each, accumulating slowly
      #   RocksDB overhead a few GB
      #   disk pool        capped at 2 GB in the ConfigMap (see below)
      #
      # Azure bills StandardSSD in tiers, so this matters: 64Gi lands
      # in E6 (~$5/mo) where 200Gi lands in E15/256GiB (~$19/mo).
      # allowVolumeExpansion is true on the StorageClass, so this can
      # grow online if it ever fills — it cannot shrink, which is the
      # other reason to start small.
      #
      # >>> PRODUCTION should use 500Gi-1Ti per the official guidance.
      #     This value is for the throwaway validation node only.
      storage: 64Gi
