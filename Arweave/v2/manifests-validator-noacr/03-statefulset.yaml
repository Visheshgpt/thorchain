# ============================================================
# 03-statefulset.yaml
# ConfigMap: arweave-node-config  |  StatefulSet: arweave-node
# Replicas: 1 | Namespace: arweave
#
# Images:  alpine:3.19 (init) + ubuntu:22.04 (main) — BOTH PUBLIC
# Release: Arweave N.2.9.5.1 (latest stable, 2026-04-02)
#
# NO ACR REQUIRED. The init container downloads the official
# release tarball from GitHub, verifies its SHA256, and extracts
# it onto the existing PVC. The main container runs it from there.
#
# Node type: Validator (official Arweave term) — joins, validates,
#            serves the HTTP API + GraphQL. Stores NO weave data.
#            Mining disabled. Matches the team's bare-metal Docker
#            node in Arweave/v1/docker-setup.md.
#
# Port: 1984 TCP — HTTP API, P2P gossip, VDF and Prometheus all
#       share ONE port. Arweave has no separate P2P port.
#
# ── STORAGE: one PVC, two subPaths ─────────────────────────
#   arweave-data-pvc
#   ├── app/    -> /opt/arweave   binary   (read-only in main)
#   └── chain/  -> /data          data_dir
#
# ── WHY NOT bin/start ──────────────────────────────────────
# bin/start is a bash `while true` loop that does NOT exec and
# has NO trap handlers. As PID 1 it swallows SIGTERM, so the pod
# is always SIGKILLed at the grace deadline — and the docs warn
# "if you kill the node abruptly it can cause rocksdb corruption
# that can be difficult to recover from." Its 15s restart loop
# also hides crashes from Kubernetes.
# bin/arweave foreground execs erlexec -> beam.smp, so the Erlang
# VM is PID 1 and SIGTERM reaches it directly.
#
# ── WHY NO apt-get ─────────────────────────────────────────
# The release bundles its own ERTS and precompiled NIFs. Their
# DT_NEEDED across every ELF resolves to exactly: libc6,
# libgcc-s1, libstdc++6, libssl3(libcrypto.so.3), libtinfo6,
# zlib1g, libsystemd0 — ALL already present in ubuntu:22.04.
# Installing packages would require root (blocked by Gatekeeper),
# make every pod start depend on Ubuntu archives, and make the
# pod non-deterministic. ubuntu:22.04 is NOT interchangeable:
# 20.04/bullseye ship libcrypto.so.1.1 and will NOT work.
# ============================================================


# ── ConfigMap: node configuration ──────────────────────────
# The config.json from Arweave/v1/docker-setup.md, with three changes:
#   + log_dir   — default is a RELATIVE path into the install dir,
#                 which is read-only here. AKS-forced.
#   - mining_addr — inert at mine:false; a placeholder would be a
#                 FATAL parse error (must be exactly 43 chars)
#   + max_disk_pool_buffer_mb: 2000 — the REAL default is 100000
#                 (100 GB). That is the buffer for chunks POSTed to
#                 this node, held inside data_dir. On the 64Gi PVC
#                 used here it could fill the whole volume. Nothing
#                 posts to a node behind a ClusterIP, so this is tail
#                 risk rather than likely — but 2 GB removes it for
#                 free. Verified valid in ar_config.erl; raise it if
#                 this node is ever exposed for uploads.
#
# WARNING: an unknown JSON key is FATAL. ar_config.erl ends its
# parser with parse_options([Opt|_], _) -> {error, unknown, Opt}.
# One typo = CrashLoopBackOff. This is the team's own "Issue 3",
# where "mining" instead of "mine" produced:
#   Failed to parse config: unknown: {<<"mining">>,false}
# Treat this schema as CLOSED.
#
# Editing this ConfigMap does NOT restart the pod. Always follow
# with: kubectl rollout restart statefulset/arweave-node -n arweave
apiVersion: v1
kind: ConfigMap
metadata:
  name: arweave-node-config
  namespace: arweave
  labels:
    app: arweave-node
    blockchain: arweave-node
    environment: non-prod
data:
  config.json: |
    {
      "peers": [
        "asia.peers.arweave.xyz",
        "europe.peers.arweave.xyz",
        "india.peers.arweave.xyz",
        "north-america.peers.arweave.xyz",
        "oceania.peers.arweave.xyz",
        "peers.arweave.xyz"
      ],
      "data_dir": "/data",
      "log_dir": "/var/log/arweave",
      "vdf_server_trusted_peers": ["vdf-server-3.arweave.xyz"],
      "transaction_blacklist_urls": ["https://public_shepherd.arweave.net"],
      "sync_jobs": 20,
      "max_disk_pool_buffer_mb": 2000,
      "port": 1984,
      "mine": false
    }

# ############################################################
# ##  NETWORK: NOT BLOCKED. Verified from inside the cluster ##
# ############################################################
#
#   wget -T 10 http://peers.arweave.xyz:1984/info
#     -> {"network":"arweave.N.1","height":1982583,"peers":498,...}
#
# Outbound TCP 1984 WORKS. An earlier test with a 5-second timeout
# returned "download timed out" and was misread as a firewall block;
# a 10-second timeout succeeds. The connection is SLOW to establish,
# not refused.
#
# That distinction matters, because Arweave's HTTP client uses a
# 2-SECOND connect timeout (visible in the crash log:
# `connect_timeout => 2000`). If peer connections need longer than
# that to establish from this cluster, every peer is marked
# "not available" even though the route is fine.
#
# So there are two candidate root causes, and the ORDER of the log
# decides between them:
#
#   A) Slow connects -> peer probes exceed the 2s timeout -> the
#      error path runs constantly -> the process owning the
#      prometheus ETS tables dies -> every later metric call gets
#      {badarg,[{ets,lookup,[prometheus_counter_table,...]}] ->
#      ar_http dies -> gun_conns_sup dies -> CrashLoopBackOff.
#
#   B) The prometheus bug fires FIRST and kills ar_http (the HTTP
#      CLIENT). With ar_http down, every peer request fails, so
#      "Peer X is not available" is a SYMPTOM, not the cause. The
#      `{noproc,{gen_server,call,[gun_conns_sup,...]}}` errors point
#      this way -- that supervisor is already gone by then.
#
# `kubectl logs --tail=50` cannot distinguish these: it shows only
# the end. Capture the FIRST 60 lines of a fresh start instead --
# whichever error appears first is the cause.
# ############################################################


---
# ── StatefulSet ────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arweave-node
  namespace: arweave
  labels:
    app: arweave-node
    blockchain: arweave-node
    component: blockchain-node
spec:
  serviceName: arweave-node
  replicas: 1
  selector:
    matchLabels:
      app: arweave-node
  template:
    metadata:
      labels:
        app: arweave-node
        blockchain: arweave-node
        component: blockchain-node
    spec:
      enableServiceLinks: false

      # RocksDB must close cleanly or a resync is required. 600s,
      # not the 60s default — shutdown is documented as slow.
      terminationGracePeriodSeconds: 600

      securityContext:
        # Non-root throughout. Gatekeeper / Azure Policy on this
        # cluster forbids root containers — and this works only
        # because nothing here installs packages. UID 1025 matches
        # thornode and mantra on this cluster.
        runAsUser: 1025
        runAsGroup: 1025
        runAsNonRoot: true
        fsGroup: 1025
        # NOT the default "Always", which recursively chowns every
        # mounted volume on every pod start.
        fsGroupChangePolicy: OnRootMismatch

      # ── Node placement ──────────────────────────────────────
      # NO nodeSelector, NO tolerations, NO dedicated pool needed.
      #
      # The cluster was rebuilt. The old pool -- 5x Standard_D2s_v6
      # (8 GiB, ~5.8 GiB allocatable) running at ~90% memory, with the
      # autoscaler already at max node group size -- is gone. It is now
      # 3x Standard_D8s_v6 (8 vCPU / 32 GiB, ~7820m / ~30 GiB
      # allocatable each). Measured free memory after the change:
      #
      #   vmss00000m  14222Mi used (47%)  -> ~15 GiB free
      #   vmss00000n   9909Mi used (33%)  -> ~20 GiB free
      #   vmss00000p   4126Mi used (13%)  -> ~25 GiB free
      #
      # That removes the constraint behind every earlier failure. For
      # the record, what went wrong before:
      #
      #   Evicted: node was low on resource: memory.
      #     threshold 100Mi, available 2240Ki
      #     container was using 3039124Ki (2.90 GiB), request 2Gi
      #   Evicted: ... available 13960Ki
      #     container was using 3772536Ki (3.60 GiB), request 2Gi
      #
      # The container never reached its own 4Gi limit -- it exhausted
      # the NODE first and the kubelet evicted the biggest
      # over-request offender. And 2.90 -> 3.60 GiB was still CLIMBING
      # when killed, so 3.6 GiB is a lower bound on the working set,
      # not the peak. Arweave holds the whole block index (~1.98M
      # blocks) plus the account tree in memory regardless of
      # storage_modules; that is why the documented floor is 8GB.
      #
      # Today the WORST node has ~15 GiB free -- roughly 4x that lower
      # bound -- so the pod is left schedulable on all three nodes.
      # That is also more resilient than pinning: if a node is drained
      # the pod simply moves, instead of going Pending with nowhere to
      # go.
      #
      # If this ever ends up sharing a node with another memory-hungry
      # workload and starts getting evicted again, THEN add a labelled
      # pool and reinstate a nodeSelector -- not before.

      initContainers:
        # ── Download, verify and install the Arweave release ────
        # alpine:3.19 already ships busybox wget, tar, sha256sum
        # AND ca-certificates-bundle, so nothing is installed and
        # this runs happily as non-root. It never RUNS the Arweave
        # binary, so musl vs glibc is irrelevant here.
        - name: install-arweave
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              # ---- VERSION SELECTION ----------------------------
              # Set ALL FOUR together. Do NOT build ASSET from
              # VERSION with a template: the asset filename format is
              # NOT stable across releases --
              #   2.9.5.1 -> arweave-2.9.5.1.ubuntu22.x86_64.tar.gz
              #   2.9.4.1 -> arweave-2.9.4.1.ubuntu22-x86_64.tar.gz
              #                                    ^ hyphen, not dot
              # A templated name silently 404s on the other release.
              # SHA values are from each release's checksums.txt.

              VERSION="2.9.5.1"
              TAG="N.2.9.5.1"
              ASSET="arweave-2.9.5.1.ubuntu22.x86_64.tar.gz"
              SHA="dcacd52be21cb6b00da438a762fc5b352d1afa410608039d5255901916bc968f"

              # --- 2.9.4.1 alternative: swap the four lines above for
              # --- these four. Older (2025-04-03) but the version the
              # --- reference runbook falls back to for the prometheus
              # --- crash. See the notes above the ConfigMap.
              # VERSION="2.9.4.1"
              # TAG="N.2.9.4.1"
              # ASSET="arweave-2.9.4.1.ubuntu22-x86_64.tar.gz"
              # SHA="fb1b63b1853bbf36f3ea34bc7a58e9ca8bccf84ecc74a91e0c0f1978d37f4d53"

              ROOT="/opt/arweave"
              DEST="${ROOT}/${VERSION}"

              # -- idempotency, KEYED ON VERSION ------------------
              # Version-stamped, so bumping VERSION actually installs
              # the new release. An unversioned guard (e.g.
              # `if [ -f /data/app/bin/start ]`) silently skips
              # forever and makes upgrades impossible.
              if [ -x "${DEST}/bin/arweave" ]; then
                echo "[init] ${VERSION} already installed — skipping download"
              else
                echo "[init] downloading ${ASSET}"
                rm -rf "${DEST}.partial"
                mkdir -p "${DEST}.partial"

                # ASSET NAME: no "N." prefix (that is only in the git
                # tag), and there is NO generic linux-x86_64 build —
                # it was dropped after 2.9.5-alpha4. Both mistakes
                # produce a 404.
                wget -q -O "${ROOT}/${ASSET}" \
                  "https://github.com/ArweaveTeam/arweave/releases/download/${TAG}/${ASSET}"

                echo "[init] verifying sha256"
                echo "${SHA}  ${ROOT}/${ASSET}" | sha256sum -c -

                # The tarball extracts FLAT — bin/ lib/ releases/
                # erts-14.2.5.11/ genesis_data/ — with no wrapper
                # directory. DO NOT add --strip-components; it would
                # shred the layout and bin/arweave would not exist.
                echo "[init] extracting"
                tar -xzf "${ROOT}/${ASSET}" -C "${DEST}.partial"
                rm -f "${ROOT}/${ASSET}"

                # Arweave CI packaging bug: two members carry absolute
                # paths (/home/runner/actions-runner/...), so tar
                # strips the leading "/" and creates a junk ./home
                # tree. Unused at runtime.
                rm -rf "${DEST}.partial/home"

                # Rename last, so an interrupted install can never
                # look complete to the guard above.
                mv "${DEST}.partial" "${DEST}"
                echo "[init] installed ${VERSION}"
              fi

              # -- container tuning -------------------------------
              # Upstream's vm.args is tuned for a MINER on bare metal.
              # Two families of setting are actively harmful here.
              #
              # 1. BUSY-WAIT. +sbwt very_long makes the Erlang
              #    schedulers spin while waiting for work: ~100% CPU
              #    at idle inside a cgroup, CFS throttling during real
              #    work. Upstream's own vm.args.src carries the fix,
              #    commented out: "## Uncomment the following line if
              #    running in a container.  ## +sbwt none"
              #
              # 2. MEMORY. This is what OOMKills the pod at 4Gi:
              #      +A1024 +SDio1024  -> ~2048 OS threads, each with
              #                           its own stack, on a 2-core pod
              #      +MBlmbcs 410629   -> ~401 MiB largest binary carrier
              #      +MBsbct  103424   -> ~101 MiB singleblock threshold
              #    Those sizes exist to hold 100 MiB recall-range
              #    binaries while mining. A validator with NO
              #    storage_modules never allocates one, so they are
              #    pure overhead against the memory limit.
              #
              #    Values below are sized for this pod, not invented:
              #    16 async / 16 dirty-IO threads comfortably serve
              #    sync_jobs 20, and 5 MiB / 512 KiB carriers are the
              #    ERTS defaults the miner tuning overrode.
              #
              # IF YOU MOVE TO A DEDICATED NODE with >= 8Gi, delete
              # this whole block and let upstream's values stand --
              # they are faster when the memory is actually there.
              #
              # Idempotent via a marker line, NOT by matching the old
              # values -- an existing PVC may already have +sbwt
              # patched from a previous run, and guarding on that
              # would skip the memory fixes entirely.
              # The [ -f ] guard matters when changing versions: an
              # older release may lay out releases/<vsn>/ differently,
              # and without it `set -e` would abort the whole init on
              # a missing file rather than just skipping the tuning.
              VMARGS="${DEST}/releases/${VERSION}/vm.args.src"
              if [ -f "${VMARGS}" ] && ! grep -q '^## k8s-container-tuned' "${VMARGS}"; then
                sed -i \
                  -e 's/^+sbwt very_long/+sbwt none/' \
                  -e 's/^+sbwtdcpu very_long/+sbwtdcpu none/' \
                  -e 's/^+sbwtdio very_long/+sbwtdio none/' \
                  -e 's/^+A1024/+A16/' \
                  -e 's/^+SDio1024/+SDio16/' \
                  -e 's/^+MBsbct 103424/+MBsbct 512/' \
                  -e 's/^+MBsmbcs 10240/+MBsmbcs 1024/' \
                  -e 's/^+MBlmbcs 410629/+MBlmbcs 5120/' \
                  "${VMARGS}"
                echo '## k8s-container-tuned' >> "${VMARGS}"
                echo "[init] patched vm.args.src for container limits"
              else
                echo "[init] vm.args.src already tuned"
              fi
              echo "[init] effective emulator flags:"
              grep -E '^\+' "${VMARGS}" 2>/dev/null | sed 's/^/         /' || echo "         (vm.args.src not found — using release defaults)"

              # -- stable path for the main container -------------
              # The StatefulSet execs /opt/arweave/current/bin/arweave,
              # so an upgrade is just this symlink moving. bin/arweave
              # resolves its own root with `pwd -P`, so the symlink is
              # transparent to it.
              ln -sfn "${DEST}" "${ROOT}/current"

              echo "[init] ready:"
              ls -la "${ROOT}/"
              # Version check WITHOUT invoking bin/arweave: its shebang is
              # "#!/usr/bin/env bash" and alpine has no bash, so calling it
              # here prints "env: can't execute 'bash'". start_erl.data holds
              # "<erts-vsn> <release-vsn>" and needs no interpreter.
              echo "[init] release: $(cat "${ROOT}/current/releases/start_erl.data")"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          # MUST stay under the main container's requests. A pod's
          # effective request is max(init, sum of app containers) —
          # a greedier init would raise the pod request and it would
          # stop fitting on node4.
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { memory: "512Mi" }
          volumeMounts:
            - name: arweave-data
              mountPath: /opt/arweave
              subPath: app

      containers:
        - name: arweave-node
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent

          # No shell wrapper — the binary is PID 1 and receives
          # SIGTERM itself. OTP's erl_signal_handler maps SIGTERM to
          # init:stop() -> ar:prep_stop/1 -> clean RocksDB close.
          command: ["/opt/arweave/current/bin/arweave"]
          args:
            - foreground
            - config_file
            - /etc/arweave/config.json

          env:
            # bin/arweave regenerates releases/<vsn>/vm.args from
            # vm.args.src on EVERY invocation (including `stop`).
            # Redirect that write so the install stays immutable.
            # The directory must ALREADY EXIST — bin/arweave tests
            # [ -d "$RELX_OUT_FILE_PATH" ] and SILENTLY falls back if
            # not, leaving an unexpanded "${ARNAME:-...}" literal in
            # vm.args that ERTS cannot parse. The emptyDir guarantees it.
            - { name: RELX_OUT_FILE_PATH, value: /run/arweave }
            # bin/arweave does `cd $ROOTDIR` before exec, and that
            # directory is read-only here — without this, a VM crash
            # would also fail to write its crash dump.
            - { name: ERL_CRASH_DUMP, value: /tmp/erl_crash.dump }

          ports:
            - name: http-p2p
              containerPort: 1984      # Single port: HTTP API + P2P gossip
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # Safe: nothing installs packages, and every write target
            # (/data, /opt/arweave, /run/arweave, /var/log/arweave,
            # /tmp, /dev/shm) is a mounted volume.
            readOnlyRootFilesystem: true

          # Sized from Arweave's documented floor ("1GB of RAM per
          # partition being mined - with a MINIMUM of 8GB"), not from
          # what we hoped would fit. The 500m/2Gi attempt evicted the
          # node twice at 2.90 and 3.60 GiB while still climbing.
          #
          # MINIMAL SIZING — this is a proof-of-concept node that will
          # be torn down once syncing is demonstrated. Production gets
          # its own build. Sized to run, not to run fast.
          #
          # TUNED FOR the rebuilt pool: Standard_D8s_v6, ~7820m CPU /
          # ~30 GiB allocatable per node, with 15-25 GiB actually free.
          #
          #   request 1 CPU / 4Gi -- the scheduling reservation. Modest
          #                  on purpose so the pod fits on any of the
          #                  three nodes even as other workloads come
          #                  and go.
          #   limit      12Gi -- THE number that matters, and the one
          #                  that failed last time at 4Gi. 3.3x the
          #                  observed 3.6 GiB lower bound, and only
          #                  ~40% of a node's allocatable memory, so
          #                  this pod cannot starve the node the way
          #                  it did on the old 8 GiB machines.
          #
          # 3.6 GiB was measured mid-climb, not at plateau, so the
          # headroom above it is deliberate insurance against an
          # unknown -- not an allocation. Unused memory costs nothing;
          # a limit is a ceiling, not a reservation.
          #
          # If it ever OOMKills, raise THIS number first (there is room
          # up to ~20Gi on these nodes) before touching anything else.
          #
          # NO cpu limit, on purpose — CFS throttling stalls block
          # validation and makes the node fall behind while still
          # looking healthy. Their docker run sets no --cpus either.
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              memory: "12Gi"

          # startup on /info: returns 200 as soon as the listener is
          # up, even before joining (reports "height": -1, "current":
          # "not_joined"). Generous threshold because ar_info's ETS
          # lookup can 500 briefly during boot.
          startupProbe:
            httpGet: { path: /info, port: http-p2p }
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 5

          # readiness on /recent, NOT /info. /info answers 200
          # unconditionally, so probing it would mark the pod Ready
          # while still "not_joined". /recent is gated on
          # ar_node:is_joined() — 503 until genuinely joined.
          readinessProbe:
            httpGet: { path: /recent, port: http-p2p }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4

          # NO livenessProbe, deliberately. Restarting a node that is
          # merely behind does not help it catch up, and each restart
          # risks interrupting a RocksDB compaction. A wedged node
          # still surfaces: readiness fails and the pod goes 0/1.

          lifecycle:
            preStop:
              exec:
                command: ["/opt/arweave/current/bin/arweave", "stop"]

          volumeMounts:
            # chain data -> data_dir
            - name: arweave-data
              mountPath: /data
              subPath: chain
            # the release, READ-ONLY — a running node has no business
            # modifying its own installation
            - name: arweave-data
              mountPath: /opt/arweave
              subPath: app
              readOnly: true
            - { name: config,  mountPath: /etc/arweave, readOnly: true }
            - { name: runtime, mountPath: /run/arweave }
            - { name: logs,    mountPath: /var/log/arweave }
            - { name: tmp,     mountPath: /tmp }
            - { name: dshm,    mountPath: /dev/shm }

      volumes:
        # THE EXISTING CLAIM — nothing new is provisioned.
        - name: arweave-data
          persistentVolumeClaim:
            claimName: arweave-data-pvc
        - name: config
          configMap:
            name: arweave-node-config
        - name: runtime
          emptyDir: { sizeLimit: 8Mi }
        - name: logs
          emptyDir: { sizeLimit: 512Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        # The team's docker run uses --shm-size=4g; Kubernetes (like
        # Docker) defaults /dev/shm to 64 MB. medium: Memory is a
        # tmpfs and is CHARGED AGAINST the 4Gi limit above, so 256Mi
        # (4x the default) leaves 3.75Gi for the Erlang heap.
        # Raise this only together with the memory limit.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
