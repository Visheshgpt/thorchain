# ============================================================
# 03-statefulset.yaml
# ConfigMap: arweave-node-config  |  StatefulSet: arweave-node
# Replicas: 1 | Namespace: arweave
#
# Images:  alpine:3.19 (init) + ubuntu:22.04 (main) — BOTH PUBLIC
# Release: Arweave N.2.9.5.1 (latest stable, 2026-04-02)
#
# NO ACR REQUIRED. The init container downloads the official
# release tarball from GitHub, verifies its SHA256, and extracts
# it onto the existing PVC. The main container runs it from there.
#
# Node type: Validator (official Arweave term) — joins, validates,
#            serves the HTTP API + GraphQL. Stores NO weave data.
#            Mining disabled. Matches the team's bare-metal Docker
#            node in Arweave/v1/docker-setup.md.
#
# Port: 1984 TCP — HTTP API, P2P gossip, VDF and Prometheus all
#       share ONE port. Arweave has no separate P2P port.
#
# ── STORAGE: one PVC, two subPaths ─────────────────────────
#   arweave-data-pvc
#   ├── app/    -> /opt/arweave   binary   (read-only in main)
#   └── chain/  -> /data          data_dir
#
# ── WHY NOT bin/start ──────────────────────────────────────
# bin/start is a bash `while true` loop that does NOT exec and
# has NO trap handlers. As PID 1 it swallows SIGTERM, so the pod
# is always SIGKILLed at the grace deadline — and the docs warn
# "if you kill the node abruptly it can cause rocksdb corruption
# that can be difficult to recover from." Its 15s restart loop
# also hides crashes from Kubernetes.
# bin/arweave foreground execs erlexec -> beam.smp, so the Erlang
# VM is PID 1 and SIGTERM reaches it directly.
#
# ── WHY NO apt-get ─────────────────────────────────────────
# The release bundles its own ERTS and precompiled NIFs. Their
# DT_NEEDED across every ELF resolves to exactly: libc6,
# libgcc-s1, libstdc++6, libssl3(libcrypto.so.3), libtinfo6,
# zlib1g, libsystemd0 — ALL already present in ubuntu:22.04.
# Installing packages would require root (blocked by Gatekeeper),
# make every pod start depend on Ubuntu archives, and make the
# pod non-deterministic. ubuntu:22.04 is NOT interchangeable:
# 20.04/bullseye ship libcrypto.so.1.1 and will NOT work.
# ============================================================


# ############################################################
# ##  ROOT CAUSE OF THE CRASH LOOP — AND WHY THIS CONFIG     ##
# ##  NO LONGER SETS transaction_blacklist_urls              ##
# ############################################################
#
# The FIRST error in every crashed start was:
#
#   {badmatch,undefined}
#     {pubkey_os_cacerts,get,0,...}
#     {gun,ensure_tls_opts,3,...}
#     {gun,initial_tls_handshake,3,...}
#   State: ... "public_shepherd.arweave.net", 443, <<"https">> ...
#
# Erlang resolves its TLS trust store through
# pubkey_os_cacerts:get/0, which reads the OS CA bundle. The
# ubuntu:22.04 base image ships every shared library Arweave needs
# but does NOT ship ca-certificates, so that call returns
# `undefined` and gun crashes before the handshake.
#
# THE CASCADE — this is why it looked like a network problem:
#   1. gun crashes on the https blacklist fetch, retrying on a timer
#   2. gun_conns_sup restarts the child until it exceeds max restart
#      intensity, then the SUPERVISOR ITSELF dies
#   3. gun_conns_sup owns EVERY gun connection — including the
#      PLAIN-HTTP peer connections on port 1984
#   4. every peer request then fails with
#        {noproc,{gen_server,call,[gun_conns_sup,...]}}
#      surfacing as "Peer x.x.x.x:1984 is not available"
#   5. those error paths hammer prometheus, whose ETS tables die
#      with their owning process -> {badarg,[{ets,lookup,
#      [prometheus_counter_table,...  -> ar_http, ar_header_sync
#      and ar_nonce_limiter_client all collapse -> CrashLoopBackOff
#
# So the peer failures and the prometheus storm were BOTH symptoms
# of one missing file. Outbound TCP 1984 was never blocked —
# verified from a pod in this cluster:
#   wget -T 10 http://peers.arweave.xyz:1984/info
#     -> {"network":"arweave.N.1","height":1982583,"peers":498,...}
#
# THE FIX: transaction_blacklist_urls is REMOVED. It was the only
# https call Arweave makes. With no TLS there is no CA lookup, and
# the whole cascade cannot start. The init container also stages a
# CA bundle onto the volume as belt-and-braces, but nothing now
# depends on it.
#
# WHAT REMOVING IT COSTS: the blacklist is the public Shepherd
# NSFW/illegal-content filter. It stops the node STORING or SERVING
# blacklisted content. This profile sets no storage_modules, so it
# stores zero weave data and serves none — the filter has nothing
# to act on here. The reference bare-metal node keeps it because
# its image installs libssl-dev and wget, which pull in CA certs
# as a dependency.
#
# TO RESTORE IT (required if storage_modules are ever added, since
# the node would then actually hold content):
#   1. add back, after log_dir:
#        "transaction_blacklist_urls": ["https://public_shepherd.arweave.net"],
#   2. confirm the CA bundle is in place first, or this crash
#      returns:
#        kubectl exec -n arweave arweave-node-0 -c arweave-node -- \
#          ls -l /etc/ssl/certs/ca-certificates.crt
# ############################################################
#
# ############################################################
# ##  PEERS: North-America-first, individually named         ##
# ############################################################
#
# The reference config used the six regional DNS pools
# (asia/europe/india/north-america/oceania + global). Changed for
# two measured reasons.
#
# 1. THE 503s. A test pod in this namespace hit a peer IP straight
#    from the crash log:
#      wget http://15.235.228.134:1984/info
#      -> HTTP/1.1 503 Service Unavailable   in 0.19s
#    190 ms, so the network is fast and the route is fine -- the
#    PEER refused us. The same peers answered 200 OK from an
#    unrelated network at the same moment, so they are healthy;
#    they were rejecting THIS cluster's egress address.
#
#    All AKS egress shares one public IP. The node had been
#    crash-looping for hours, re-probing ~30 peers on every restart,
#    so that single address looked like a flood. Arweave nodes rate
#    limit per IP (requests_per_minute_limit, default 900).
#    Self-inflicted, and it clears with a cooldown -- which is why
#    the rebuild procedure has a wait in it.
#
#    Arweave reports ANY non-200 as "Peer x.x.x.x is not available",
#    which is what sent this investigation down a firewall
#    rabbit-hole. It was never a firewall.
#
# 2. LATENCY BUDGET. Arweave probes trusted peers with
#    `connect_timeout => 1000` -- ONE second -- and a 2s total
#    request timeout (both visible in the crash log). This cluster
#    is in centralus, so North American peers have the widest
#    margin against those timeouts. Asia/Oceania peers add RTT and
#    extra probe volume for no benefit here.
#
# Every hostname below was verified returning 200 OK at the same
# chain height before being added. Naming individual servers rather
# than only DNS pools means the node gets a known-good set instead
# of whatever the pool happens to return.
#
# Full official list (all regions):
#   https://docs.arweave.org/mining/overview/trusted-peers
#   live status: https://status.arweave.xyz/
#
# If this node is ever redeployed outside the US, swap these for
# the matching regional hostnames.
#
# ── ConfigMap: node configuration ──────────────────────────
# The config.json from Arweave/v1/docker-setup.md, with three changes:
#   + log_dir   — default is a RELATIVE path into the install dir,
#                 which is read-only here. AKS-forced.
#   - mining_addr — inert at mine:false; a placeholder would be a
#                 FATAL parse error (must be exactly 43 chars)
#   + max_disk_pool_buffer_mb: 2000 — the REAL default is 100000
#                 (100 GB). That is the buffer for chunks POSTed to
#                 this node, held inside data_dir. On the 64Gi PVC
#                 used here it could fill the whole volume. Nothing
#                 posts to a node behind a ClusterIP, so this is tail
#                 risk rather than likely — but 2 GB removes it for
#                 free. Verified valid in ar_config.erl; raise it if
#                 this node is ever exposed for uploads.
#
# WARNING: an unknown JSON key is FATAL. ar_config.erl ends its
# parser with parse_options([Opt|_], _) -> {error, unknown, Opt}.
# One typo = CrashLoopBackOff. This is the team's own "Issue 3",
# where "mining" instead of "mine" produced:
#   Failed to parse config: unknown: {<<"mining">>,false}
# Treat this schema as CLOSED.
#
# Editing this ConfigMap does NOT restart the pod. Always follow
# with: kubectl rollout restart statefulset/arweave-node -n arweave
apiVersion: v1
kind: ConfigMap
metadata:
  name: arweave-node-config
  namespace: arweave
  labels:
    app: arweave-node
    blockchain: arweave-node
    environment: non-prod
data:
  config.json: |
    {
      "peers": [
        "dal-1.east.us.north-america.arweave.xyz",
        "den-1.west.us.north-america.arweave.xyz",
        "vin-1.east.us.north-america.arweave.xyz",
        "pho-1.east.us.north-america.arweave.xyz",
        "bhs-1.ca.north-america.arweave.xyz",
        "van-1.ca.north-america.arweave.xyz",
        "north-america.peers.arweave.xyz",
        "peers.arweave.xyz"
      ],
      "data_dir": "/data",
      "log_dir": "/var/log/arweave",
      "vdf_server_trusted_peers": ["vdf-server-3.arweave.xyz", "vdf-server-4.arweave.xyz"],
      "sync_jobs": 20,
      "max_disk_pool_buffer_mb": 2000,
      "port": 1984,
      "mine": false
    }
  # Upstream's releases/2.9.5.1/vm.args.src, VERBATIM, with exactly one
  # change: the three +sbwt* values are `none` instead of `very_long`.
  # That is upstream's OWN commented-out advice ("Uncomment the following
  # line if running in a container") -- it stops the Erlang schedulers
  # busy-waiting at ~100% CPU inside a cgroup, and has nothing to do with
  # memory.
  #
  # EVERY OTHER VALUE IS UPSTREAM'S. In particular the binary allocator
  # settings are left alone:
  #     +MBsbct 103424   (101 MiB singleblock carrier threshold)
  #     +MBlmbcs 410629  (~401 MiB largest multi-block carrier)
  #     +A1024 +SDio1024
  # An earlier version of this deployment lowered those to squeeze into a
  # 4Gi container, and it caused OOMKills during "Downloading the wallet
  # tree" -- see upstream's own comment on +MBsbct below for why they are
  # deliberately high. Do not lower them again.
  #
  # THIS IS MOUNTED OVER THE EXTRACTED RELEASE'S COPY. Previously the init
  # container sed-patched the file on the PVC, guarded by a marker line.
  # That made the outcome depend on PVC state, marker state, and whether
  # the pod had actually been recreated -- three ways for a change to
  # silently not apply. A ConfigMap mount has none of those: whatever is
  # here is what the node runs, every time, and `kubectl apply` always
  # wins.
  vm.args.src: |
    ## Name of the node
    -name ${ARNODE:-arweave@127.0.0.1}

    ## Cookie for distributed erlang
    -setcookie ${ARCOOKIE:-arweave}

    ## Disable the emulator break handler. Note this also makes the VM
    ## ignore SIGINT/SIGQUIT -- inside the pod only SIGTERM stops the node.
    +Bi

    ## Enables the kernel poll functionality.
    +Ktrue

    ## +A1024: emulator number of threads in the Async long thread pool for
    ## linked in drivers, mostly unused
    +A1024

    ## +SDio1024: emulator Scheduler thread count for Dirty I/O, 200
    ## threads for file access
    +SDio1024

    ## +MBsbct 103424: binary_alloc singleblock carrier threshold (in KiB)
    ## (101MiB, default 512KiB). Blocks larger than the threshold are
    ## placed in singleblock carriers. However multi-block carriers are
    ## more efficient. Since we have so many 100MiB binary blocks due to
    ## the recall range, set the threshold so that they are all placed in
    ## multi-block carriers and not single-block carriers.
    +MBsbct 103424

    ## +MBsmbcs 10240: binary_alloc smallest multi-block carrier size (in
    ## KiB) (10MiB, default 256KiB).
    +MBsmbcs 10240

    ## MBlmbcs 410629: binary_alloc largest multi-block carrier size (in
    ## KiB) (~401MiB, default 5MiB). Set so that a single multi-block
    ## carrier can hold roughly 4 full recall ranges.
    +MBlmbcs 410629

    ## +MBmmsbc 1024: binary_alloc maximum mseg_alloc singleblock carriers
    ## (1024 carriers, default 256).
    +MBmmmbc 1024

    ## +MBas aobf: emulator Memory Binary Allocation Strategy set to
    ## Address Order Best Fit.
    +MBas aobf

    ## ---- THE ONLY CHANGE FROM UPSTREAM: container busy-wait ----
    ## Sets scheduler busy wait threshold. Upstream ships `very_long`.
    +sbwt none

    ## Sets dirty scheduler busy wait threshold.
    +sbwtdcpu none

    ## Sets dirty IO scheduler busy wait threshold
    +sbwtdio none
    ## -----------------------------------------------------------

    ##  Sets scheduler wakeup threshold.
    +swt very_low

    ##  Sets dirty scheduler wakeup threshold.
    +swtdcpu very_low

    ## Sets dirty IO scheduler wakeup threshold.
    +swtdio very_low


---
# ── StatefulSet ────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arweave-node
  namespace: arweave
  labels:
    app: arweave-node
    blockchain: arweave-node
    component: blockchain-node
spec:
  serviceName: arweave-node
  replicas: 1
  selector:
    matchLabels:
      app: arweave-node
  template:
    metadata:
      labels:
        app: arweave-node
        blockchain: arweave-node
        component: blockchain-node
    spec:
      enableServiceLinks: false

      # RocksDB must close cleanly or a resync is required. 600s,
      # not the 60s default — shutdown is documented as slow.
      terminationGracePeriodSeconds: 600

      securityContext:
        # Non-root throughout. Gatekeeper / Azure Policy on this
        # cluster forbids root containers — and this works only
        # because nothing here installs packages. UID 1025 matches
        # thornode and mantra on this cluster.
        runAsUser: 1025
        runAsGroup: 1025
        runAsNonRoot: true
        fsGroup: 1025
        # NOT the default "Always", which recursively chowns every
        # mounted volume on every pod start.
        fsGroupChangePolicy: OnRootMismatch

      # ── Node placement ──────────────────────────────────────
      # NO nodeSelector, NO tolerations, NO dedicated pool needed.
      #
      # The cluster was rebuilt. The old pool -- 5x Standard_D2s_v6
      # (8 GiB, ~5.8 GiB allocatable) running at ~90% memory, with the
      # autoscaler already at max node group size -- is gone. It is now
      # 3x Standard_D8s_v6 (8 vCPU / 32 GiB, ~7820m / ~30 GiB
      # allocatable each). Measured free memory after the change:
      #
      #   vmss00000m  14222Mi used (47%)  -> ~15 GiB free
      #   vmss00000n   9909Mi used (33%)  -> ~20 GiB free
      #   vmss00000p   4126Mi used (13%)  -> ~25 GiB free
      #
      # That removes the constraint behind every earlier failure. For
      # the record, what went wrong before:
      #
      #   Evicted: node was low on resource: memory.
      #     threshold 100Mi, available 2240Ki
      #     container was using 3039124Ki (2.90 GiB), request 2Gi
      #   Evicted: ... available 13960Ki
      #     container was using 3772536Ki (3.60 GiB), request 2Gi
      #
      # The container never reached its own 4Gi limit -- it exhausted
      # the NODE first and the kubelet evicted the biggest
      # over-request offender. And 2.90 -> 3.60 GiB was still CLIMBING
      # when killed, so 3.6 GiB is a lower bound on the working set,
      # not the peak. Arweave holds the whole block index (~1.98M
      # blocks) plus the account tree in memory regardless of
      # storage_modules; that is why the documented floor is 8GB.
      #
      # Today the WORST node has ~15 GiB free -- roughly 4x that lower
      # bound -- so the pod is left schedulable on all three nodes.
      # That is also more resilient than pinning: if a node is drained
      # the pod simply moves, instead of going Pending with nowhere to
      # go.
      #
      # If this ever ends up sharing a node with another memory-hungry
      # workload and starts getting evicted again, THEN add a labelled
      # pool and reinstate a nodeSelector -- not before.
      #
      # ---- PINNED, deliberately and temporarily --------------------
      # A 20Gi limit is NOT safe on every node. Measured actual usage:
      #   vmss00000m  14551Mi used -> ~14.8Gi free   20Gi does NOT fit
      #   vmss00000n  11276Mi used -> ~18.0Gi free   marginal
      #   vmss00000p   2616Mi used -> ~26.5Gi free   fits comfortably
      # (all three: 30452504Ki = ~29 GiB allocatable)
      #
      # Requests tell a rosier story -- ~21-22Gi free everywhere -- but
      # requests are not what triggers eviction. On vmss00000m the pods
      # already USE 14.5Gi while only REQUESTING 8Gi, so a 20Gi
      # neighbour would push that node over and the kubelet would start
      # evicting. That already happened once on the old pool and it is
      # worse than an OOMKill: eviction destroys the pod and steals
      # headroom from other teams' workloads.
      #
      # So for the wallet-tree run, pin to the empty node.
      #
      # REMOVED. The pin existed to guarantee headroom for the
      # wallet-tree spike, which is now past: the node joined at height
      # 1983235 and settled at ~10.5Gi. Leaving it pinned by hostname
      # would be brittle -- the name changes on scale/upgrade, and a
      # drain would leave the pod Pending with nowhere to go.
      #
      # To re-pin (e.g. before a fresh join on a busy cluster):
      #   nodeSelector:
      #     kubernetes.io/hostname: <node-name>
      # Pick the node with the most FREE memory in `kubectl top nodes`,
      # not the most free by requests -- the two differ a lot here.

      initContainers:
        # ── Download, verify and install the Arweave release ────
        # alpine:3.19 already ships busybox wget, tar, sha256sum
        # AND ca-certificates-bundle, so nothing is installed and
        # this runs happily as non-root. It never RUNS the Arweave
        # binary, so musl vs glibc is irrelevant here.
        - name: install-arweave
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              # ---- VERSION SELECTION ----------------------------
              # Set ALL FOUR together. Do NOT build ASSET from
              # VERSION with a template: the asset filename format is
              # NOT stable across releases --
              #   2.9.5.1 -> arweave-2.9.5.1.ubuntu22.x86_64.tar.gz
              #   2.9.4.1 -> arweave-2.9.4.1.ubuntu22-x86_64.tar.gz
              #                                    ^ hyphen, not dot
              # A templated name silently 404s on the other release.
              # SHA values are from each release's checksums.txt.

              VERSION="2.9.5.1"
              TAG="N.2.9.5.1"
              ASSET="arweave-2.9.5.1.ubuntu22.x86_64.tar.gz"
              SHA="dcacd52be21cb6b00da438a762fc5b352d1afa410608039d5255901916bc968f"

              # --- 2.9.4.1 alternative: swap the four lines above for
              # --- these four. Older (2025-04-03) but the version the
              # --- reference runbook falls back to for the prometheus
              # --- crash. See the notes above the ConfigMap.
              # VERSION="2.9.4.1"
              # TAG="N.2.9.4.1"
              # ASSET="arweave-2.9.4.1.ubuntu22-x86_64.tar.gz"
              # SHA="fb1b63b1853bbf36f3ea34bc7a58e9ca8bccf84ecc74a91e0c0f1978d37f4d53"

              ROOT="/opt/arweave"
              DEST="${ROOT}/${VERSION}"

              # -- idempotency, KEYED ON VERSION ------------------
              # Version-stamped, so bumping VERSION actually installs
              # the new release. An unversioned guard (e.g.
              # `if [ -f /data/app/bin/start ]`) silently skips
              # forever and makes upgrades impossible.
              if [ -x "${DEST}/bin/arweave" ]; then
                echo "[init] ${VERSION} already installed — skipping download"
              else
                echo "[init] downloading ${ASSET}"
                rm -rf "${DEST}.partial"
                mkdir -p "${DEST}.partial"

                # ASSET NAME: no "N." prefix (that is only in the git
                # tag), and there is NO generic linux-x86_64 build —
                # it was dropped after 2.9.5-alpha4. Both mistakes
                # produce a 404.
                wget -q -O "${ROOT}/${ASSET}" \
                  "https://github.com/ArweaveTeam/arweave/releases/download/${TAG}/${ASSET}"

                echo "[init] verifying sha256"
                echo "${SHA}  ${ROOT}/${ASSET}" | sha256sum -c -

                # The tarball extracts FLAT — bin/ lib/ releases/
                # erts-14.2.5.11/ genesis_data/ — with no wrapper
                # directory. DO NOT add --strip-components; it would
                # shred the layout and bin/arweave would not exist.
                echo "[init] extracting"
                tar -xzf "${ROOT}/${ASSET}" -C "${DEST}.partial"
                rm -f "${ROOT}/${ASSET}"

                # Arweave CI packaging bug: two members carry absolute
                # paths (/home/runner/actions-runner/...), so tar
                # strips the leading "/" and creates a junk ./home
                # tree. Unused at runtime.
                rm -rf "${DEST}.partial/home"

                # Rename last, so an interrupted install can never
                # look complete to the guard above.
                mv "${DEST}.partial" "${DEST}"
                echo "[init] installed ${VERSION}"
              fi

              # -- vm.args.src is NOT patched here anymore --------
              # It is supplied by the ConfigMap and mounted straight
              # over the extracted release copy in the main
              # container. See the vm.args.src key in the ConfigMap
              # above for why: sed-patching made the result depend on
              # PVC state and a marker line, which meant a change
              # could silently fail to apply.

              # -- CA certificates --------------------------------
              # ROOT CAUSE OF THE ORIGINAL CRASH LOOP. ubuntu:22.04
              # ships every shared library Arweave needs but does NOT
              # ship ca-certificates. Erlang's TLS resolves its trust
              # store via pubkey_os_cacerts:get/0, which reads the OS
              # bundle; with no bundle it returns `undefined` and gun
              # dies with:
              #   {badmatch,undefined}
              #     {pubkey_os_cacerts,get,0,...}
              #     {gun,ensure_tls_opts,3,...}
              #     {gun,initial_tls_handshake,3,...}
              #
              # Arweave makes exactly ONE https call -- fetching
              # transaction_blacklist_urls from
              # https://public_shepherd.arweave.net:443. That crash
              # repeats on a timer, gun_conns_sup restarts the child
              # until it exceeds max restart intensity, and then the
              # SUPERVISOR ITSELF dies. gun_conns_sup owns every gun
              # connection, including the PLAIN-HTTP peer connections,
              # so after that every peer request fails with
              #   {noproc,{gen_server,call,[gun_conns_sup,...]}}
              # which surfaces as "Peer x.x.x.x:1984 is not available"
              # and then the prometheus badarg cascade.
              #
              # So the peer failures were a SYMPTOM. Outbound TCP 1984
              # was never blocked -- verified from a pod:
              #   wget -T 10 http://peers.arweave.xyz:1984/info
              #     -> {"network":"arweave.N.1","peers":498,...}
              #
              # The fix: alpine DOES ship ca-certificates-bundle in its
              # base image (which is how this very container downloaded
              # the release over https a few lines above). Copy that
              # bundle onto the shared volume; the main container mounts
              # it at /etc/ssl/certs/ca-certificates.crt, which is the
              # FIRST path pubkey_os_cacerts checks on Linux.
              #
              # Cheaper than adding a package install, and it keeps the
              # main container non-root with no apt dependency.
              if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
                cp /etc/ssl/certs/ca-certificates.crt "${ROOT}/ca-certificates.crt"
                echo "[init] CA bundle staged ($(wc -l < "${ROOT}/ca-certificates.crt") lines)"
              else
                echo "[init] WARNING: no CA bundle in the init image — TLS will fail"
              fi

              # -- stable path for the main container -------------
              # The StatefulSet execs /opt/arweave/current/bin/arweave,
              # so an upgrade is just this symlink moving. bin/arweave
              # resolves its own root with `pwd -P`, so the symlink is
              # transparent to it.
              ln -sfn "${DEST}" "${ROOT}/current"

              echo "[init] ready:"
              ls -la "${ROOT}/"
              # Version check WITHOUT invoking bin/arweave: its shebang is
              # "#!/usr/bin/env bash" and alpine has no bash, so calling it
              # here prints "env: can't execute 'bash'". start_erl.data holds
              # "<erts-vsn> <release-vsn>" and needs no interpreter.
              echo "[init] release: $(cat "${ROOT}/current/releases/start_erl.data")"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          # MUST stay under the main container's requests. A pod's
          # effective request is max(init, sum of app containers) —
          # a greedier init would raise the pod request and it would
          # stop fitting on node4.
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { memory: "512Mi" }
          volumeMounts:
            - name: arweave-data
              mountPath: /opt/arweave
              subPath: app

      containers:
        - name: arweave-node
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent

          # No shell wrapper — the binary is PID 1 and receives
          # SIGTERM itself. OTP's erl_signal_handler maps SIGTERM to
          # init:stop() -> ar:prep_stop/1 -> clean RocksDB close.
          command: ["/opt/arweave/current/bin/arweave"]
          args:
            - foreground
            - config_file
            - /etc/arweave/config.json

          env:
            # bin/arweave regenerates releases/<vsn>/vm.args from
            # vm.args.src on EVERY invocation (including `stop`).
            # Redirect that write so the install stays immutable.
            # The directory must ALREADY EXIST — bin/arweave tests
            # [ -d "$RELX_OUT_FILE_PATH" ] and SILENTLY falls back if
            # not, leaving an unexpanded "${ARNAME:-...}" literal in
            # vm.args that ERTS cannot parse. The emptyDir guarantees it.
            - { name: RELX_OUT_FILE_PATH, value: /run/arweave }
            # bin/arweave does `cd $ROOTDIR` before exec, and that
            # directory is read-only here — without this, a VM crash
            # would also fail to write its crash dump.
            - { name: ERL_CRASH_DUMP, value: /tmp/erl_crash.dump }

          ports:
            - name: http-p2p
              containerPort: 1984      # Single port: HTTP API + P2P gossip
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # Safe: nothing installs packages, and every write target
            # (/data, /opt/arweave, /run/arweave, /var/log/arweave,
            # /tmp, /dev/shm) is a mounted volume.
            readOnlyRootFilesystem: true

          # Sized from Arweave's documented floor ("1GB of RAM per
          # partition being mined - with a MINIMUM of 8GB"), not from
          # what we hoped would fit. The 500m/2Gi attempt evicted the
          # node twice at 2.90 and 3.60 GiB while still climbing.
          #
          # MINIMAL SIZING — this is a proof-of-concept node that will
          # be torn down once syncing is demonstrated. Production gets
          # its own build. Sized to run, not to run fast.
          #
          # TUNED FOR the rebuilt pool: Standard_D8s_v6, ~7820m CPU /
          # ~30 GiB allocatable per node, with 15-25 GiB actually free.
          #
          #   request 1 CPU / 4Gi -- the scheduling reservation. Modest
          #                  on purpose so the pod fits on any of the
          #                  three nodes even as other workloads come
          #                  and go.
          #   limit      12Gi -- THE number that matters, and the one
          #                  that failed last time at 4Gi. 3.3x the
          #                  observed 3.6 GiB lower bound, and only
          #                  ~40% of a node's allocatable memory, so
          #                  this pod cannot starve the node the way
          #                  it did on the old 8 GiB machines.
          #
          # 3.6 GiB was measured mid-climb, not at plateau, so the
          # headroom above it is deliberate insurance against an
          # unknown -- not an allocation. Unused memory costs nothing;
          # a limit is a ceiling, not a reservation.
          #
          # If it ever OOMKills, raise THIS number first (there is room
          # up to ~20Gi on these nodes) before touching anything else.
          #
          # NO cpu limit, on purpose — CFS throttling stalls block
          # validation and makes the node fall behind while still
          # looking healthy. Their docker run sets no --cpus either.
          # RAISED after an OOMKill during the wallet-tree download.
          #
          # The node got all the way through joining -- block index,
          # joining block, block trail -- and died on "Downloading the
          # wallet tree, chunk 7". That phase pulls Arweave's entire
          # account tree into memory and is the peak of the whole node
          # lifecycle; steady state afterwards is much lower.
          #
          #   request 8Gi -- matches Arweave's documented floor and
          #                  reserves it, so the pod cannot land on a
          #                  node that has no room for the peak.
          #   limit  16Gi -- was 12Gi, which the wallet tree exceeded.
          #                  The reference bare-metal node runs the
          #                  whole thing in 24 GB total, so 16Gi is a
          #                  real ceiling rather than a guess.
          #
          # Node capacity check (D8s_v6, ~30Gi allocatable each):
          #   vmss00000m ~15Gi free   vmss00000n ~20Gi free
          #   vmss00000p ~25Gi free
          # A 16Gi limit fits even the busiest of the three.
          #
          # If it OOMKills again, raise the LIMIT before anything
          # else -- there is room up to ~20Gi -- and check
          # `kubectl top pod` to see where it actually peaked.
          resources:
            requests:
              cpu: "1"
              # 6Gi. The REQUEST is what actually reserves node
              # capacity, so this is the number that matters for
              # sharing the cluster. Measured steady state is ~10.5Gi,
              # so the pod will run above its request -- acceptable
              # here because the nodes have ~29Gi allocatable and
              # plenty spare. Raise it back toward 12Gi if this ever
              # shares a node with another memory-hungry workload,
              # since eviction ranks by (usage - request).
              memory: "6Gi"
            limits:
              # 14Gi. Lowered from 20Gi now that the real cause of the
              # wallet-tree OOMKills is fixed -- it was the binary
              # allocator tuning (+MBsbct 512 / +MBlmbcs 5120), not the
              # size of the workload. With upstream allocator values the
              # node settles at ~10.5Gi, so 14Gi is ~1.3x measured
              # steady state.
              #
              # A restart re-runs the wallet tree, and its peak has NOT
              # been measured with the corrected vm.args. Watch it:
              #   while ($true) { kubectl top pod arweave-node-0 -n arweave --no-headers; Start-Sleep 2 }
              # If it OOMKills during the wallet tree, raise this to
              # 16-18Gi -- the nodes have ~29Gi allocatable, so there is
              # room. Do not go past ~20Gi: node-level eviction is worse
              # than an OOMKill because it destroys the pod and takes
              # headroom from other workloads.
              #
              # Earlier history, for context: 12Gi -> 16Gi -> 20Gi, each
              # OOMKilled during the wallet tree -- all with the harmful
              # allocator settings still in place.
              #
              # This is near the practical ceiling for these nodes:
              # ~30Gi allocatable, and the least-loaded had ~25Gi free.
              # Going higher risks starving the node and triggering the
              # kubelet eviction that killed an earlier attempt -- which
              # is worse than an OOMKill, because eviction destroys the
              # pod and takes other workloads' headroom with it.
              #
              # The reference bare-metal node runs the whole thing in
              # 24 GB TOTAL (docker run --memory=24g), so if 20Gi is not
              # enough the problem is not sizing -- see the note on
              # ERL_FLAGS below before raising this again.
              memory: "20Gi"

          # startup on /info: returns 200 as soon as the listener is
          # up, even before joining (reports "height": -1, "current":
          # "not_joined"). Generous threshold because ar_info's ETS
          # lookup can 500 briefly during boot.
          startupProbe:
            httpGet: { path: /info, port: http-p2p }
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 5

          # readiness on /recent, NOT /info. /info answers 200
          # unconditionally, so probing it would mark the pod Ready
          # while still "not_joined". /recent is gated on
          # ar_node:is_joined() — 503 until genuinely joined.
          readinessProbe:
            httpGet: { path: /recent, port: http-p2p }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4

          # NO livenessProbe, deliberately. Restarting a node that is
          # merely behind does not help it catch up, and each restart
          # risks interrupting a RocksDB compaction. A wedged node
          # still surfaces: readiness fails and the pod goes 0/1.

          lifecycle:
            preStop:
              exec:
                command: ["/opt/arweave/current/bin/arweave", "stop"]

          volumeMounts:
            # chain data -> data_dir
            - name: arweave-data
              mountPath: /data
              subPath: chain
            # the release, READ-ONLY — a running node has no business
            # modifying its own installation
            - name: arweave-data
              mountPath: /opt/arweave
              subPath: app
              readOnly: true
            # CA trust store, staged by the init container from the
            # alpine image. ubuntu:22.04 has NO ca-certificates, and
            # without this Erlang's pubkey_os_cacerts:get/0 returns
            # `undefined`, gun's TLS handshake crashes, and it takes
            # gun_conns_sup down with it — which kills the plain-HTTP
            # peer connections too. See the init container for the
            # full chain.
            #
            # This exact path matters: it is the first entry in the
            # list pubkey_os_cacerts checks on Linux. A single-FILE
            # subPath mount, so it does not shadow the rest of
            # /etc/ssl/certs.
            - name: arweave-data
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: app/ca-certificates.crt
              readOnly: true
            # Erlang VM args, mounted OVER the extracted release's copy.
            # bin/arweave regenerates releases/<vsn>/vm.args from this
            # .src on every start, so whatever the ConfigMap says is what
            # the VM runs -- no sed, no marker file, no dependence on
            # what happens to be on the PVC. `kubectl apply` always wins.
            # (Path is version-stamped to match VERSION in the init
            # container; bump both together on an upgrade.)
            - name: config
              mountPath: /opt/arweave/2.9.5.1/releases/2.9.5.1/vm.args.src
              subPath: vm.args.src
              readOnly: true
            - { name: config,  mountPath: /etc/arweave, readOnly: true }
            - { name: runtime, mountPath: /run/arweave }
            - { name: logs,    mountPath: /var/log/arweave }
            - { name: tmp,     mountPath: /tmp }
            - { name: dshm,    mountPath: /dev/shm }

      volumes:
        # THE EXISTING CLAIM — nothing new is provisioned.
        - name: arweave-data
          persistentVolumeClaim:
            claimName: arweave-data-pvc
        - name: config
          configMap:
            name: arweave-node-config
        - name: runtime
          emptyDir: { sizeLimit: 8Mi }
        - name: logs
          emptyDir: { sizeLimit: 512Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        # The team's docker run uses --shm-size=4g; Kubernetes (like
        # Docker) defaults /dev/shm to 64 MB. medium: Memory is a
        # tmpfs and is CHARGED AGAINST the 4Gi limit above, so 256Mi
        # (4x the default) leaves 3.75Gi for the Erlang heap.
        # Raise this only together with the memory limit.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
