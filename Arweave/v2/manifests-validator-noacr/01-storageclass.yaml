# ============================================================
# 01-storageclass.yaml
# Azure Disk StorageClass — provisioner: disk.csi.azure.com
# reclaimPolicy: Retain | volumeBindingMode: WaitForFirstConsumer
#
# UNCHANGED — this is the existing class, already applied.
# Re-applying it is a no-op.
#
# NOTE: StorageClass `parameters` are IMMUTABLE. skuName cannot be
#       switched in place; changing it needs a new class + new PVC
#       + a full resync. Not worth it here — see below.
#
# skuName: StandardSSD_LRS is the right call for this node.
#   StandardSSD_LRS  baseline 500 IOPS / 60 MB/s, FLAT across almost
#                    all disk sizes (growing the disk buys capacity,
#                    not speed). No single-instance SLA.
#   Premium_LRS      IOPS scale with size (P10 500 -> P30 5000),
#                    100-200 MB/s, consistent low latency, 99.9%
#                    single-instance SLA. Roughly 2x the cost.
#
#   This profile stores NO weave data (no storage_modules), so the
#   write load is just block headers — roughly one block every two
#   minutes plus the backfill. That is nowhere near 500 IOPS, so
#   Standard SSD is not a bottleneck here.
#
#   It WOULD be a bottleneck for an archive node: RocksDB compaction
#   across multi-TB storage modules will saturate 500 IOPS. If weave
#   partitions are ever added, put THOSE on a separate Premium class
#   rather than trying to change this one.
# ============================================================


apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: arweave-storage
  labels:
    app: arweave-node
    blockchain: arweave-node
    environment: non-prod
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_LRS             # Standard SSD — default SKU for this cluster
reclaimPolicy: Retain                  # NEVER Delete — blockchain data is irreplaceable
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
