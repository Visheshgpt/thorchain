# ============================================================
# 04-service.yaml
# TWO Services:
#   Service 1 — Headless ClusterIP (StatefulSet DNS)
#   Service 2 — ClusterIP (in-cluster API access)
#
# NOTE: Arweave uses a single port 1984 for EVERYTHING:
#       HTTP API, P2P gossip, CM cluster communication, VDF server.
#       There is no separate P2P port to expose.
#
# ── WHY THERE IS NO LoadBalancer HERE ──────────────────────
# The internal LB (arweave-node-lb) was removed. It could not be
# provisioned — the VNet subnet is out of addresses:
#
#   SyncLoadBalancerFailed  service/arweave-node-lb
#   RESPONSE 400  ERROR CODE: SubnetIsFull
#   "Subnet .../subnets/default-0 with address prefix
#    10.202.17.192/27 does not have enough capacity for 1 IP
#    addresses."
#
# A /27 is 32 addresses, 27 usable after Azure's 5 reserved, and
# it is shared by the whole cluster. That is an infrastructure
# capacity problem, not a manifest problem — no annotation or
# retry fixes it. It also affects any other team that tries to
# add an internal LB, so it is worth raising with whoever owns
# the VNet rather than just working around it here.
#
# Nothing is lost by dropping it for now:
#   - in-cluster consumers  -> use the ClusterIP below
#   - jumpbox / ad-hoc      -> kubectl port-forward
#   - Arweave peering       -> unaffected. An INTERNAL LB hands out
#     an RFC1918 address that public Arweave peers could never dial
#     anyway, so it never contributed to peering. The node joins
#     and syncs over outbound connectivity, which still works.
#
# ── TO RESTORE IT once subnet capacity exists ──────────────
# Append the block at the bottom of this file. Keep port 1984 on
# both sides — the node advertises its CONFIGURED port to peers,
# so a remapped frontend would advertise an address that does not
# answer.
# ============================================================


# ── Service 1: Headless ────────────────────────────────────
# Required by the StatefulSet for stable pod DNS:
#   arweave-node-0.arweave-node.arweave.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: arweave-node
  namespace: arweave
  labels:
    app: arweave-node
    blockchain: arweave-node
    service-type: headless
spec:
  clusterIP: None
  # Readiness is gated on /recent, which returns 503 until the node
  # has actually joined — 5-15 minutes on first boot, longer if peers
  # are slow. Without this the pod has NO DNS name during that window,
  # which makes early debugging harder than it needs to be.
  publishNotReadyAddresses: true
  selector:
    app: arweave-node
  ports:
    - name: http-p2p
      port: 1984
      targetPort: 1984
      protocol: TCP


---


# ── Service 2: ClusterIP — in-cluster API access ───────────
# Replaces the internal LoadBalancer. Consumes NO VNet address —
# a ClusterIP is allocated from the cluster's service CIDR, so it
# is unaffected by the full subnet.
#
# Prefer this over the headless Service for anything that consumes
# the node: the headless one sets publishNotReadyAddresses, so it
# will hand out the pod IP while the node is still "not_joined" and
# answering 503. This one only routes once readiness passes.
#
#   http://arweave-node-api.arweave.svc.cluster.local:1984/info
apiVersion: v1
kind: Service
metadata:
  name: arweave-node-api
  namespace: arweave
  labels:
    app: arweave-node
    blockchain: arweave-node
    service-type: clusterip
spec:
  type: ClusterIP
  selector:
    app: arweave-node
  ports:
    - name: http-p2p
      port: 1984
      targetPort: 1984
      protocol: TCP


# ============================================================
# RESTORE-LATER BLOCK — uncomment only after the subnet has free
# addresses. Verify first:
