# =============================================================================
# Arweave VALIDATOR on AKS -- NO ACR REQUIRED.
#
# Same node as manifests-validator/, same config, same probes. The ONLY
# difference is how the binary gets onto the pod: an init container downloads
# the official release tarball to a small PVC instead of it being baked into
# a custom image in ACR.
#
# WHY THIS PROFILE EXISTS:
#   `az acr build` needs Microsoft.ContainerRegistry/registries/scheduleRun/
#   action (effectively Contributor on the registry). That permission was
#   denied, so this unblocks deployment today using only PUBLIC images.
#   It is the same pattern Mantra uses on this cluster ("Init Container
#   Pattern (No ACR Required)" -- Mantra-AKS.md).
#
# WHY IT IS NOT THE LONG-TERM ANSWER:
#   - First boot depends on github.com being reachable from the cluster.
#   - The binary is not scanned/signed by your registry pipeline.
#   - Two images to keep current (alpine + ubuntu) instead of one you control.
#   Prefer manifests-validator/ once the ACR permission lands. Switching is a
#   drop-in: identical ConfigMap, Services, and data PVC.
#
# -----------------------------------------------------------------------------
# WHY EACH IMAGE IS WHAT IT IS -- this is the part that is easy to get wrong
# -----------------------------------------------------------------------------
# init  = alpine:3.19
#   Only needs to DOWNLOAD, VERIFY and EXTRACT -- it never runs the Arweave
#   binary, so musl vs glibc is irrelevant here. Alpine's base already ships
#   busybox wget, tar, sha256sum AND ca-certificates-bundle, so nothing has to
#   be installed and the container can run as non-root. (alpine:3.19 is already
#   in use on this cluster by thornode's init-snapshot.)
#
# main  = ubuntu:22.04, with NO package installation at all
#   The release bundles its own ERTS and precompiled NIFs (RandomX, VDF,
#   secp256k1, RocksDB). Their DT_NEEDED across every ELF resolves to exactly:
#     ld-linux-x86-64.so.2  libc.so.6  libcrypto.so.3  libgcc_s.so.1
#     libm.so.6  libstdc++.so.6  libsystemd.so.0  libtinfo.so.6  libz.so.1
#   Every one of those is ALREADY in the ubuntu:22.04 base image (libc6,
#   libgcc-s1, libstdc++6, libssl3, libtinfo6, zlib1g, libsystemd0). RandomX,
#   VDF and RocksDB statically link GMP/snappy/lz4/zstd.
#
#   So `apt-get install` is not merely unnecessary, it is actively harmful:
#   it requires root (which Gatekeeper forbids), it makes every pod start
#   depend on Ubuntu archives being reachable, and it makes the pod
#   non-deterministic over time.
#
#   ubuntu:22.04 is NOT interchangeable:
#     ubuntu:22.04 / 24.04 -> OK   (libcrypto.so.3, glibc >= 2.35)
#     ubuntu:20.04, debian:bullseye -> BROKEN (libcrypto.so.1.1)
#     alpine -> BROKEN (musl, not glibc)
#   Match the base image to the tarball variant you download.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arweave
  namespace: arweave
  labels:
    app: arweave
    app.kubernetes.io/name: arweave
    app.kubernetes.io/part-of: arweave-node
    app.kubernetes.io/managed-by: kubectl
    arweave-profile: validator-noacr
spec:
  serviceName: arweave-headless
  replicas: 1
  selector:
    matchLabels:
      app: arweave
  template:
    metadata:
      labels:
        app: arweave
        app.kubernetes.io/name: arweave
        arweave-profile: validator-noacr
    spec:
      enableServiceLinks: false

      # See manifests-validator/04-statefulset.yaml for the full reasoning.
      # Uncomment only if peers.arweave.xyz fails to resolve from the pod:
      #   kubectl exec -n arweave arweave-0 -- getent hosts peers.arweave.xyz
      # dnsConfig:
      #   nameservers: ["8.8.8.8", "1.1.1.1"]

      # RocksDB must close cleanly. Docs: "if you kill the node abruptly it
      # can cause rocksdb corruption that can be difficult to recover from."
      terminationGracePeriodSeconds: 600

      securityContext:
        # Non-root throughout -- required by Gatekeeper / Azure Policy here,
        # and possible only because NOTHING in this pod installs packages.
        runAsUser: 1025
        runAsGroup: 1025
        runAsNonRoot: true
        fsGroup: 1025
        fsGroupChangePolicy: OnRootMismatch

      # -- Node placement ----------------------------------------------------
      # Measured capacity: 5x Standard_D2s_v3, ~1900m / ~5810Mi allocatable.
      #   node1 340m/1394Mi  node2 420m/1224Mi  node3 333m/894Mi
      #   node4 740m/3266Mi  <-- only viable node
      #   node5  13m/2098Mi
      # Requests below (500m / 2Gi) fit node4 with 240m / 1218Mi to spare.
      # No nodeSelector: with one viable node, pinning would only turn a
      # reschedule into a permanent Pending.

      initContainers:
        # ── Fetch, verify and install the official release ──────────────────
        - name: install-arweave
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              VERSION="2.9.5.1"
              TAG="N.2.9.5.1"
              ASSET="arweave-${VERSION}.ubuntu22.x86_64.tar.gz"
              # From the release's checksums.txt. Verified against the asset.
              SHA="dcacd52be21cb6b00da438a762fc5b352d1afa410608039d5255901916bc968f"

              ROOT="/opt/arweave"
              DEST="${ROOT}/${VERSION}"

              # -- idempotency, keyed on VERSION -----------------------------
              # Version-stamped, so bumping VERSION above actually installs the
              # new release. An unversioned guard silently skips forever and
              # makes upgrades impossible.
              if [ -x "${DEST}/bin/arweave" ]; then
                echo "[init] ${VERSION} already installed -- skipping download"
              else
                echo "[init] downloading ${ASSET}"
                rm -rf "${DEST}.partial"
                mkdir -p "${DEST}.partial"

                # NOTE the asset name: NO "N." prefix (that is only in the git
                # tag), and there is NO generic linux-x86_64 build -- it was
                # dropped after 2.9.5-alpha4. Getting this wrong yields a 404.
                wget -q -O "${ROOT}/${ASSET}" \
                  "https://github.com/ArweaveTeam/arweave/releases/download/${TAG}/${ASSET}"

                echo "[init] verifying sha256"
                echo "${SHA}  ${ROOT}/${ASSET}" | sha256sum -c -

                # The tarball extracts FLAT (bin/ lib/ releases/ erts-*/
                # genesis_data/) with no wrapper directory.
                # DO NOT add --strip-components -- that would shred the layout.
                echo "[init] extracting"
                tar -xzf "${ROOT}/${ASSET}" -C "${DEST}.partial"
                rm -f "${ROOT}/${ASSET}"

                # Arweave CI packaging bug: two members carry absolute paths
                # (/home/runner/actions-runner/...), so tar strips the leading
                # "/" and creates a junk ./home tree. Unused at runtime.
                rm -rf "${DEST}.partial/home"

                # Rename last, so a half-finished install can never look
                # complete to the idempotency check above.
                mv "${DEST}.partial" "${DEST}"
                echo "[init] installed ${VERSION}"
              fi

              # -- container tuning ------------------------------------------
              # Upstream ships +sbwt very_long, which makes the Erlang
              # schedulers busy-wait: ~100% CPU at idle inside a cgroup, and
              # CFS throttling during real work. Upstream's own vm.args.src
              # carries the fix, commented out:
              #   "## Uncomment the following line if running in a container.
              #    ## +sbwt none"
              # We take that advice. Idempotent -- the grep guards re-runs.
              VMARGS="${DEST}/releases/${VERSION}/vm.args.src"
              if grep -q '^+sbwt very_long' "${VMARGS}"; then
                sed -i \
                  -e 's/^+sbwt very_long/+sbwt none/' \
                  -e 's/^+sbwtdcpu very_long/+sbwtdcpu none/' \
                  -e 's/^+sbwtdio very_long/+sbwtdio none/' \
                  "${VMARGS}"
                echo "[init] patched vm.args.src -> +sbwt none"
              fi

              # -- stable path for the main container ------------------------
              # The StatefulSet execs /opt/arweave/current/bin/arweave, so an
              # upgrade is just this symlink moving. bin/arweave resolves its
              # own root with `pwd -P`, so the symlink is transparent to it.
              ln -sfn "${DEST}" "${ROOT}/current"

              echo "[init] ready:"
              ls -la "${ROOT}/"
              "${ROOT}/current/bin/arweave" version || true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          # MUST stay below the main container's requests. A pod's effective
          # request is max(init requests, sum of app containers) -- an init
          # container asking for more would raise the whole pod's request and
          # it would stop fitting on node4.
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { memory: "512Mi" }
          volumeMounts:
            - { name: bin, mountPath: /opt/arweave }

      containers:
        - name: arweave
          # PUBLIC image, no registry credentials, no ACR. Pinned to 22.04 to
          # match the ubuntu22 tarball (libcrypto.so.3 / glibc 2.35).
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent

          # No shell wrapper: the binary is PID 1 directly, so it receives
          # SIGTERM itself. bin/arweave ends in `exec erlexec`, which execv()s
          # beam.smp -- OTP's erl_signal_handler then maps SIGTERM to
          # init:stop() -> ar:prep_stop/1 -> clean RocksDB close.
          #
          # This is `bin/arweave foreground`, NOT `bin/start`. bin/start is a
          # bash `while true` loop that does NOT exec and has NO trap
          # handlers -- as PID 1 it swallows SIGTERM (guaranteeing a SIGKILL
          # and likely RocksDB corruption) and its internal 15s restart loop
          # hides crashes from Kubernetes.
          command: ["/opt/arweave/current/bin/arweave"]
          args:
            - foreground
            - config_file
            - /etc/arweave/config.json

          env:
            # bin/arweave regenerates releases/<vsn>/vm.args from vm.args.src
            # on EVERY invocation (including `stop`). Redirect that write to
            # an emptyDir so the installed release stays immutable after init.
            # The directory must already exist -- bin/arweave tests
            # [ -d "$RELX_OUT_FILE_PATH" ] and SILENTLY falls back if not,
            # leaving an unexpanded "${ARNAME:-...}" literal in vm.args that
            # ERTS cannot parse. The emptyDir guarantees it exists.
            - { name: RELX_OUT_FILE_PATH, value: /run/arweave }

            # bin/arweave does `cd $ROOTDIR` before exec, so the Erlang VM's
            # working directory is /opt/arweave/current -- which is mounted
            # read-only here. Without this, a VM crash would ALSO fail to
            # write its crash dump, replacing a useful diagnostic with a
            # confusing "cannot write erl_crash.dump" error.
            - { name: ERL_CRASH_DUMP, value: /tmp/erl_crash.dump }

          ports:
            # One port for everything: REST API, GraphQL, peer gossip, chunk
            # sync, VDF, Prometheus. Arweave has no separate P2P port.
            - { name: http, containerPort: 1984, protocol: TCP }

          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # Safe because nothing installs packages and every write target
            # (/data, /opt/arweave, /run/arweave, /var/log/arweave, /tmp) is a
            # mounted volume.
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              memory: "4Gi"
              # NO cpu limit -- CFS throttling stalls block validation and
              # makes the node fall behind while still looking healthy.
              # Their docker run sets no --cpus either.

          # startup on /info: 200 as soon as the listener is up, even before
          # joining (reports "height": -1, "current": "not_joined").
          # Generous threshold because ar_info:get_info/0 hard-matches an ETS
          # table that is briefly unpopulated at boot, so /info can 500 early.
          startupProbe:
            httpGet: { path: /info, port: http }
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 5

          # readiness on /recent, NOT /info. /info answers 200 unconditionally,
          # so probing it marks the pod Ready while still "not_joined".
          # /recent is gated on ar_node:is_joined() -- 503 until truly joined.
          readinessProbe:
            httpGet: { path: /recent, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4

          # No livenessProbe, deliberately. Restarting a node that is merely
          # behind does not help it catch up, and each restart risks
          # interrupting a RocksDB compaction. A wedged node still surfaces:
          # readiness fails and the pod goes 0/1.

          lifecycle:
            preStop:
              exec:
                command: ["/opt/arweave/current/bin/arweave", "stop"]

          volumeMounts:
            - { name: data,    mountPath: /data }
            - { name: bin,     mountPath: /opt/arweave, readOnly: true }
            - { name: config,  mountPath: /etc/arweave, readOnly: true }
            - { name: runtime, mountPath: /run/arweave }
            - { name: logs,    mountPath: /var/log/arweave }
            - { name: tmp,     mountPath: /tmp }
            - { name: dshm,    mountPath: /dev/shm }

      volumes:
        - name: data
          persistentVolumeClaim: { claimName: arweave-data }
        # Written by the init container, mounted READ-ONLY here -- the running
        # node has no business modifying its own installation.
        - name: bin
          persistentVolumeClaim: { claimName: arweave-bin }
        - name: config
          configMap:
            name: arweave-config
        - name: runtime
          emptyDir: { sizeLimit: 8Mi }
        - name: logs
          emptyDir: { sizeLimit: 512Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        # Their docker run uses --shm-size=4g; K8s defaults /dev/shm to 64 MB.
        # medium: Memory is a tmpfs and is CHARGED AGAINST the 4Gi limit, so
        # 256Mi here (4x the default) leaves 3.75Gi for the Erlang heap.
        # Raise this only together with the memory limit, never on its own.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
