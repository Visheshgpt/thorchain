apiVersion: v1                      # Stable core API version for Namespace resources
kind: Namespace
metadata:
  name: cronos                      # Namespace name — derived from node name (Cronos EVM)
  labels:
    blockchain: cronos              # Identifies the blockchain protocol running in this namespace
    node: node_cronos               # Unique node identifier used for label selectors across all resources
    managed-by: manifest-generator  # Tracks that this resource was created by the AKS Manifest Generator



