apiVersion: storage.k8s.io/v1       # Stable API version for StorageClass resources
kind: StorageClass
metadata:
  name: node-cronos-storage         # StorageClass name — referenced by PVC in 02-node_cronos_pvc.yaml
  labels:
    blockchain: cronos              # Identifies the blockchain this StorageClass belongs to
    node: node_cronos               # Node identifier for label selectors
    managed-by: manifest-generator  # Tracks origin of this resource
provisioner: disk.csi.azure.com     # Azure Disk CSI driver — verified provisioner for AKS
# Delete -- TEST CLUSTER ONLY.
#
# Deleting the PVC now destroys the Azure disk with it. That is the
# behaviour you want while iterating: no Released PVs to chase, no
# orphaned disks quietly billing. The data here is a public snapshot
# that re-downloads in ~11 minutes, so it is cheap to lose.
#
# >> SWITCH BACK TO Retain BEFORE PRODUCTION, and certainly before
#    adopting migrated prod data. With Delete, one `kubectl delete pvc`
#    is unrecoverable -- there is no Released PV to re-bind. <<
#
# reclaimPolicy is IMMUTABLE on a StorageClass (the API server forbids
# updates to it), so changing this needs the SC deleted and recreated.
# An existing PV's policy CAN be patched in place, though -- see runbook.
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer  # Provision disk in same AZ as the scheduled pod
allowVolumeExpansion: true          # Required for pvc-watcher auto-expansion to work
parameters:
  # StandardSSD_LRS -- matches node-cronospos-storage and node-kava-storage.
  #
  # Was Premium_LRS, sized for an ARCHIVE node. This is a PRUNED node
  # restoring a ~20-24 GB snapshot, so the Premium IOPS curve buys nothing
  # and costs roughly double.
  #
  # StorageClass parameters are IMMUTABLE: `kubectl apply` on a changed
  # skuName silently does NOTHING. Changing it requires deleting the
  # StorageClass and the PVC/PV bound to it. See the runbook order.
  skuName: StandardSSD_LRS
                                    # RocksDB random reads on 4.5–6T dataset need P_LRS throughput



