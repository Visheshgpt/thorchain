# =============================================================================
# 03-node_cronos_statefulset.yaml — Cronos EVM archive node
#
# Chain:   Cronos Mainnet (cronosmainnet_25-1)
#          Cosmos SDK + Ethermint (EVM-compatible), binary: cronosd
#
# IMAGE STRATEGY — ubuntu:22.04 + binary on PVC (no ACR):
#   Cronos publishes no official Docker image — only binary tarballs.
#   The internal tag cronos-archive:v1.7.8 is a local VM build; it matches
#   the Dockerfile in blockchains/cronoszkevm/a exactly:
#     FROM ubuntu:22.04
#     apt-get install curl wget jq tar
#     wget .../cronos_1.7.8_Linux_x86_64.tar.gz && tar && mv bin/cronosd /usr/local/bin
#   We replicate that build once in init-install-cronosd (ubuntu:22.04),
#   store the binary on the PVC, and the main container runs it on ubuntu:22.04.
#   No ACR, no ImagePullBackOff.
#
# DATA MIGRATION (existing archive data on the old VM):
#   Original docker-compose: /CronosDisk/node-cronos-archive/data:/data
#   Inside the container:    CRONOS_HOME=/data/.cronos
#   On the PVC the data must live at:  /data/.cronos/
#   ADOPT_EXISTING=true (default) skips snapshot and uses migrated data.
#   See full-doc.md for the rsync/kubectl-cp migration commands.
#
# INIT CONTAINERS (mirrors the VM Dockerfile + entrypoint.sh):
#   1. restore-snapshot  — Polkachu Cronos snapshot OR adopts migrated data
#   2. install-cronosd   — Replicates the Dockerfile RUN block: apt-get + wget
#                          binary + tar + verify. Stores binary at /data/bin/
#   3. configure         — Mirrors entrypoint.sh exactly (init + genesis + sed)
#                          plus K8s-specific binds (RPC 0.0.0.0, EVM JSON-RPC)
#
# PATHS (from entrypoint.sh):
#   Volume mount:  /data         (matches Dockerfile VOLUME ["/data"])
#   CRONOS_HOME:   /data/.cronos (matches entrypoint.sh CRONOS_HOME="/data/.cronos")
#   Binary:        /data/bin/cronosd (stored on PVC by init-install-cronosd)
#
# CONFIG VALUES (from entrypoint.sh — unchanged):
#   pruning             = "nothing"       (archive)
#   minimum-gas-prices  = "0.025basecro"
#   app-db-backend      = "rocksdb"
#   query-gas-limit     = "100000000"
# =============================================================================


apiVersion: apps/v1                 # Stable API version for StatefulSet resources
kind: StatefulSet
metadata:
  name: node-cronos                 # StatefulSet name — pod will be named node-cronos-0
  namespace: cronos                 # Must match namespace in 00-node_cronos_namespace.yaml
  labels:
    blockchain: cronos              # Protocol identifier
    node: node_cronos               # Node identifier used by all services as selector
    managed-by: manifest-generator  # Tracks origin of this resource
spec:
  serviceName: node-cronos          # Must match the headless Service name in 04-node_cronos_service.yaml
  replicas: 1                       # Single replica — blockchain nodes do not horizontally scale
  selector:
    matchLabels:
      node: node_cronos             # Must match pod template labels below
  template:
    metadata:
      labels:
        blockchain: cronos          # Protocol identifier on the pod
        node: node_cronos           # Used by all three Services as the selector
    spec:
      enableServiceLinks: false     # Prevents k8s <SVC>_PORT env vars colliding with Cosmos/viper key lookups
      securityContext:
        runAsNonRoot: false         # Matches docker-compose `user: root` — cronosd runs as root
        runAsUser: 0                # Root — same as the original VM Dockerfile (no USER instruction)
        fsGroup: 0                  # Root group — PVC files owned by root
        fsGroupChangePolicy: OnRootMismatch  # Avoids re-chowning gigabytes on every pod start
      terminationGracePeriodSeconds: 600  # Must flush RocksDB cleanly — SIGKILL mid-write corrupts store


      initContainers:


        # --- 1. Snapshot restore / data adoption ----------------------------
        # ⚠  ARCHIVE NODE with existing VM data:
        #    ADOPT_EXISTING=true (default) — skips snapshot and adopts data
        #    already on the PVC (migrated from /CronosDisk/node-cronos-archive/data/.cronos/).
        #    See full-doc.md for the data migration steps.
        #
        #    If starting fresh (no existing data), set ADOPT_EXISTING=false.
        #    Polkachu pruned snapshot will restore — note: no traces before
        #    snapshot height will be available on a pruned baseline.
        - name: restore-snapshot
          image: alpine:3.19
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            # FORCE_RESTORE — wipe data and re-pull snapshot.
            # Token-based: set to a new string to trigger once. Leaving it
            # set after it fires is harmless (token is recorded on the PVC).
            - { name: RESET_DATA,      value: "statesync-1" }
            # ADOPT_EXISTING — treat data already on the PVC as legitimate
            # (migrated prod data). Set "true" after copying VM data to PVC.
            - { name: ADOPT_EXISTING, value: "false" }
          resources:
            requests:
              cpu: "100m"           # Just curl + lz4 streaming — no CPU-intensive work
              memory: "256Mi"
            limits:
              memory: "1Gi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              HOME_DIR=/data/.cronos
              TOKENFILE="$HOME_DIR/.reset-token"
              
              # ---------------------------------------------------------------
              # Cronos EVM has NO public snapshot or state-sync provider.
              # Polkachu / quicksync / kjnodes all 404 for this chain, so the old
              # snapshot-download logic here was dead code pointing at a URL that
              # does not exist. This container now does one job: make sure the
              # data directory is in a state the node can actually open.
              # ---------------------------------------------------------------
              mkdir -p "$HOME_DIR"
              
              if [ "${ADOPT_EXISTING:-false}" = "true" ]; then
                echo "[prepare] ADOPT_EXISTING=true -- using the data already on this volume"
                exit 0
              fi
              
              # RESET_DATA -- one shot per distinct token. The value is recorded on
              # the volume once honoured, so a crashloop cannot re-wipe. Change the
              # value to force another reset.
              #
              # WHY THIS EXISTS: a half-written store is not recoverable in place.
              # Repeated mid-write crashes left data/ corrupt, and RocksDB segfaults
              # on a truncated store (exit 139, no Go stack trace) rather than
              # failing cleanly. Switching db_backend on top of it gave
              # "failed to initialize database: EOF". Both need a clean directory.
              TOKEN="${RESET_DATA:-}"
              SEEN="$(cat "$TOKENFILE" 2>/dev/null || true)"
              if [ -z "$TOKEN" ]; then
                echo "[prepare] RESET_DATA empty -- leaving the volume untouched"
                exit 0
              fi
              if [ "$TOKEN" = "$SEEN" ]; then
                echo "[prepare] reset token $TOKEN already honoured -- nothing to do"
                exit 0
              fi
              
              echo "[prepare] reset token $TOKEN is new -- clearing data/"
              du -sh "$HOME_DIR/data" 2>/dev/null || true
              
              # Clear WITHOUT depending on who owns what inside. Deleting a file
              # needs write+execute on its PARENT directory, not ownership of the
              # file -- and those dirs were created by different UIDs across runs.
              # Renaming data/ only needs write on $HOME_DIR, which always works.
              rm -rf "$HOME_DIR/data" 2>/dev/null || true
              if [ -d "$HOME_DIR/data" ]; then
                STAMP=$(cat /proc/sys/kernel/random/uuid 2>/dev/null | cut -c1-8 || echo old)
                echo "[prepare] rm blocked -- moving data/ aside as data.discard.$STAMP"
                mv "$HOME_DIR/data" "$HOME_DIR/data.discard.$STAMP"
              fi
              for d in "$HOME_DIR"/data.discard.*; do
                if [ -d "$d" ]; then
                  echo "[prepare] reclaiming $d"
                  rm -rf "$d" 2>/dev/null || echo "[prepare] could not fully remove $d"
                fi
              done
              
              # A stale genesis.json from a failed init is worse than none: the
              # configure step re-downloads it when it is missing or too small.
              rm -f "$HOME_DIR/config/genesis.json" 2>/dev/null || true
              rm -f "$HOME_DIR/config/addrbook.json" 2>/dev/null || true
              
              # `cronosd init` is skipped whenever config.toml already exists, so
              # wiping data/ leaves priv_validator_state.json missing and the node
              # exits with:
              #   open .../data/priv_validator_state.json: no such file or directory
              # height 0 is the correct value for a fresh node.
              mkdir -p "$HOME_DIR/data"
              echo '{"height":"0","round":0,"step":0}' > "$HOME_DIR/data/priv_validator_state.json"

              # printf '%s' -- NOT the '"'"' escaping that was here, which
              # evaluated to printf "'%s'" and wrote the token wrapped in literal
              # quotes. $SEEN then never matched $TOKEN and the wipe fired on
              # EVERY restart, re-syncing from genesis each time.
              printf '%s' "$TOKEN" > "$TOKENFILE"
              df -h "$HOME_DIR" 2>/dev/null || true
              echo "[prepare] DONE -- data/ cleared, node will start from genesis"
          # volumeMounts -- THIS WAS MISSING. Without it this container ran
          # entirely in its own ephemeral overlay filesystem: the wipe cleared
          # nothing on the PVC and priv_validator_state.json was written to a
          # layer that is discarded when the container exits. `df -h` gave it
          # away by reporting 'overlay' instead of the Azure disk.
          volumeMounts:
            - name: cronos-data
              mountPath: /data

        - name: install-cronosd
          image: ubuntu:22.04
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            # No capabilities drop — ubuntu:22.04 apt-get requires CAP_DAC_OVERRIDE
            # to write to /var/cache/apt/archives/partial/ (owned by _apt uid 100).
            # Matches the original Dockerfile which has no capability restrictions.
          resources:
            requests:
              cpu: "250m"           # apt-get + wget download — moderate CPU
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              VERSION="1.7.8"
              ASSET="cronos_${VERSION}_Linux_x86_64.tar.gz"
              REL="https://github.com/crypto-org-chain/cronos/releases/download/v${VERSION}"
              BIN_DIR="/data/bin"


              mkdir -p "$BIN_DIR"


              if [ -x "$BIN_DIR/cronosd" ]; then
                echo "[install] cronosd already present -- skipping"
                exit 0
              fi


              echo "[install] apt-get install (mirrors Dockerfile RUN block)"
              apt-get update -qq
              apt-get install -y -q --no-install-recommends curl wget jq tar ca-certificates


              echo "[install] downloading $ASSET (mirrors Dockerfile wget)"
              wget -q "$REL/$ASSET" -O "/tmp/$ASSET"


              # SHA256 verification
              # TODO: replace with the actual hash before production deploy
              # Get it from: curl -fsSL $REL/checksums.txt | grep $ASSET
              # Verified against upstream checksums.txt for v1.7.8, re-hashed locally.
              SHA="3840147724054449e3b8dd9a3829b88979da628686720dc16a9f39a5fbc911d4"
              # Always verify. There is no "skip" branch on purpose: an unverified
              # binary is worse than a failed boot. sha256sum -c exits non-zero on
              # mismatch and `set -e` stops the container.
              echo "[install] verifying sha256"
              echo "$SHA  /tmp/$ASSET" | sha256sum -c -


              echo "[install] extracting (mirrors Dockerfile tar -zxvf)"
              tar -zxf "/tmp/$ASSET" -C /tmp
              mv /tmp/bin/cronosd "$BIN_DIR/cronosd"
              chmod 0755 "$BIN_DIR/cronosd"
              rm -f "/tmp/$ASSET"
              echo "[install] cronosd v$VERSION installed at $BIN_DIR/cronosd"
              "$BIN_DIR/cronosd" version
          volumeMounts:
            - name: cronos-data
              mountPath: /data


        # --- 3. Node init + config -------------------------------------------
        # Mirrors entrypoint.sh EXACTLY (steps 1–3), then adds K8s-specific
        # network bindings that Docker port-mapping handles automatically
        # but Kubernetes Services require explicitly.
        #
        # Entrypoint.sh steps reproduced here:
        #   1. cronosd init (if config.toml absent)
        #   2. download genesis.json (if absent)
        #   3. sed patches: pruning, minimum-gas-prices, app-db-backend, query-gas-limit
        # K8s additions:
        #   4. bind CometBFT RPC to 0.0.0.0:26657 (default is 127.0.0.1)
        #   5. enable + bind EVM JSON-RPC to 0.0.0.0:8545/8546
        #   6. set seeds + persistent_peers for peer discovery
        - name: configure
          image: ubuntu:22.04
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            # No capabilities drop — same reason as install-cronosd above.
          resources:
            requests:
              cpu: "100m"           # sed + curl for genesis — minimal CPU
              memory: "256Mi"
            limits:
              memory: "512Mi"
          env:
            - { name: MONIKER,       value: "pegasus-node" }          # From docker-compose environment
            - { name: CRONOS_HOME,   value: "/data/.cronos" }         # From entrypoint.sh
            - { name: CHAIN_ID,      value: "cronosmainnet_25-1" }    # From entrypoint.sh
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              CM="/data/bin/cronosd"


              echo "[configure] apt-get install curl (needed for genesis download)"
              apt-get update -qq
              apt-get install -y -q --no-install-recommends curl ca-certificates jq


              # ----------------------------------------------------------
              # Init only if config.toml does not exist yet (first boot).
              # Never run init on subsequent boots — it fails with data/
              # already present and corrupts genesis.json with a stub.
              # ----------------------------------------------------------
              if [ ! -f "$CRONOS_HOME/config/config.toml" ]; then
                echo "[configure] first boot — running cronosd init"
                "$CM" init "$MONIKER" --chain-id "$CHAIN_ID" --home "$CRONOS_HOME"
              fi


              # ----------------------------------------------------------
              # Genesis: download if missing or stub (<100KB = corrupted).
              # Real Cronos mainnet genesis is ~50MB.
              # ----------------------------------------------------------
              GENESIS_SIZE=$(wc -c < "$CRONOS_HOME/config/genesis.json" 2>/dev/null || echo 0)
              # 10000, NOT 100000. The real cronosmainnet_25-1 genesis is 19,442
              # bytes (verified: HTTP 200, valid JSON, initial_height 1). Cronos EVM
              # launched fresh in 2021, so a small genesis is CORRECT. The old
              # "~50MB" assumption made this test ALWAYS true, so genesis was
              # re-downloaded on every boot.
              if [ "$GENESIS_SIZE" -lt 10000 ]; then
                echo "[configure] genesis missing or corrupted (${GENESIS_SIZE} bytes) — downloading"
                curl -fsSL \
                  https://raw.githubusercontent.com/crypto-org-chain/cronos-mainnet/master/cronosmainnet_25-1/genesis.json \
                  -o "$CRONOS_HOME/config/genesis.json"
                echo "[configure] genesis $(wc -c < "$CRONOS_HOME/config/genesis.json") bytes"
                # Published sha256 from the official Cronos docs. The genesis is only
                # 19,442 bytes and that is CORRECT -- verified against this hash.
                GEN_SHA="58f17545056267f57a2d95f4c9c00ac1d689a580e220c5d4de96570fbbc832e1"
                echo "$GEN_SHA  $CRONOS_HOME/config/genesis.json" | sha256sum -c -
              else
                echo "[configure] genesis.json OK (${GENESIS_SIZE} bytes)"
              fi


              # ----------------------------------------------------------
              # app.toml — entrypoint.sh patches + force json-rpc disabled.
              # json-rpc enable=true was accumulated by earlier configure runs
              # and causes a SIGSEGV crash at startup. Explicitly set false.
              # ----------------------------------------------------------
              if [ -f "$CRONOS_HOME/config/app.toml" ]; then
                echo "[configure] patching app.toml"
                # pruned, not archive: this is a TEST node proving the stack runs.
                sed -i -E 's#^(pruning[[:space:]]*=[[:space:]]*).*$#\1"custom"#'                    "$CRONOS_HOME/config/app.toml"
                sed -i -E 's#^(pruning-keep-recent[[:space:]]*=[[:space:]]*).*$#\1"100"#'            "$CRONOS_HOME/config/app.toml"
                sed -i -E 's#^(pruning-interval[[:space:]]*=[[:space:]]*).*$#\1"10"#'                "$CRONOS_HOME/config/app.toml"
                sed -i -E 's#^(minimum-gas-prices[[:space:]]*=[[:space:]]*).*$#\1"0.025basecro"#'   "$CRONOS_HOME/config/app.toml"
                # goleveldb, matching db_backend below. See the note there: rocksdb
                # SEGFAULTS with this release binary.
                sed -i -E 's#^(app-db-backend[[:space:]]*=[[:space:]]*).*$#\1"goleveldb"#'          "$CRONOS_HOME/config/app.toml"
                sed -i -E 's#^(query-gas-limit[[:space:]]*=[[:space:]]*).*$#\1"100000000"#'         "$CRONOS_HOME/config/app.toml"
                # Force json-rpc disabled — crashes cronosd v1.7.8 on AKS (SIGSEGV on 8545)
                sed -i '/^\[json-rpc\]/,/^\[/{s/^enable = .*/enable = false/}' "$CRONOS_HOME/config/app.toml"
              fi


              # ----------------------------------------------------------
              # config.toml — K8s required patches only.
              # db_backend must match whatever the data on disk was written with.
              # pex=true + real seeds -- see the block below for why the old
              # pex=false/empty-seeds combination could never sync.
              # ----------------------------------------------------------
              if [ -f "$CRONOS_HOME/config/config.toml" ]; then
                echo "[configure] patching config.toml"
                sed -i 's|^laddr = "tcp://127.0.0.1:26657"|laddr = "tcp://0.0.0.0:26657"|' "$CRONOS_HOME/config/config.toml"
                # db_backend: goleveldb. NOT a preference -- rocksdb is PROVEN broken
                # with this binary. Run by hand in the pod, same host, clean data dir:
                #   --db_backend=rocksdb   -> Segmentation fault (core dumped), exit 139
                #   --db_backend=goleveldb -> upgrades all 21 IAVL stores and reaches
                #                             "starting node with ABCI CometBFT in-process"
                # The app is fine; only the rocksdb path faults. This release binary
                # is built with the grocksdb_no_link tag, so its rocksdb linkage
                # differs from a self-built image -- which is why the prod VM (custom
                # image from dockerfile-rocksdb) runs rocksdb and this does not.
                # MIGRATION CONSEQUENCE: prod data is RocksDB and cannot be adopted
                # by this node. That needs a self-built rocksdb image, as the VM has.
                sed -i 's|^db_backend = .*|db_backend = "goleveldb"|'                       "$CRONOS_HOME/config/config.toml"
                # PEERS -- the previous config blanked seeds AND persistent_peers AND
                # set pex=false. That is not a workaround, it guarantees permanent
                # isolation: no seeds, no peers, no peer exchange means the node can
                # never discover anyone and can never sync. The old comment ("pex=false
                # prevents fatal exit when address book is empty") had it backwards --
                # the address book was empty BECAUSE the seeds had been blanked.
                # Seeds from the cosmos chain-registry for cronosmainnet_25-1.
                SEEDS="0d5cf1394a1cfde28dc8f023567222abc0f47534@cronos-seed-0.crypto.org:26656,3032073adc06d710dd512240281637c1bd0c8a7b@cronos-seed-1.crypto.org:26656,04f43116b4c6c70054d9c2b7485383df5b1ed1da@cronos-seed-2.crypto.org:26656,337377dcda43d79c537d2c4d93ad3b698ce9452e@bd-cronos-mainnet-seed-node-01.bdnodes.net:26656,abedfe94dd5731e9750e045ca8d8e40aa6d3c60b@seed.cronos.jerrychong.com:26656,8542cd7e6bf9d260fef543bc49e59be5a3fa9074@seed.publicnode.com:26656"
                # persistent_peers straight from the official Cronos state-sync doc.
                # NOTE the hostnames: seed-N.cronos.com, NOT cronos-seed-N.crypto.org.
                # Same node IDs, but these are the ones Cronos publishes for state sync.
                PPEERS="0d5cf1394a1cfde28dc8f023567222abc0f47534@seed-0.cronos.com:26656,3032073adc06d710dd512240281637c1bd0c8a7b@seed-1.cronos.com:26656,04f43116b4c6c70054d9c2b7485383df5b1ed1da@seed-2.cronos.com:26656,337377dcda43d79c537d2c4d93ad3b698ce9452e@bd-cronos-mainnet-seed-node-01.bdnodes.net:26656"
                sed -i 's|^pex = .*|pex = true|'                                            "$CRONOS_HOME/config/config.toml"
                sed -i "s|^seeds = .*|seeds = \"$SEEDS\"|"                                   "$CRONOS_HOME/config/config.toml"
                sed -i "s|^persistent_peers = .*|persistent_peers = \"$PPEERS\"|"             "$CRONOS_HOME/config/config.toml"
                # ---- STATE SYNC ---------------------------------------------
                # THIS IS WHAT MAKES CRONOS BOOTABLE AT ALL.
                #
                # Starting from genesis is IMPOSSIBLE with a modern binary. The
                # mainnet genesis (sha256 verified above) carries the 2021-era
                # gov module layout -- deposit_params / voting_params /
                # tally_params. cosmos-sdk v0.47 consolidated those into a single
                # `params` object, and cronosd v1.7.8 runs cosmos-sdk v0.53.4, so
                # x/gov InitGenesis does:
                #     err = k.Params.Set(ctx, *data.Params)     genesis.go:21
                # data.Params is nil -> nil pointer dereference -> SIGSEGV.
                #
                # State sync never calls InitChain: the node applies a snapshot
                # instead of initialising from genesis, so that code path is
                # never reached. It is also the only option -- there is no public
                # tarball snapshot provider for Cronos EVM.
                #
                # Per the official docs, trust_height = latest - 1000.
                SNAP_RPC="https://rpc.cronos.com:443"
                LATEST=$(curl -fsSL --retry 5 --max-time 60 "$SNAP_RPC/block" | jq -r .result.block.header.height)
                if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
                  echo "[configure] FATAL: cannot reach $SNAP_RPC for a trust point"; exit 1
                fi
                TRUST_HEIGHT=$((LATEST - 1000))
                TRUST_HASH=$(curl -fsSL --retry 5 --max-time 60 "$SNAP_RPC/block?height=$TRUST_HEIGHT" | jq -r .result.block_id.hash)
                if [ -z "$TRUST_HASH" ] || [ "$TRUST_HASH" = "null" ]; then
                  echo "[configure] FATAL: cannot fetch trust hash at $TRUST_HEIGHT"; exit 1
                fi
                echo "[configure] state sync trust point: height=$TRUST_HEIGHT hash=$TRUST_HASH"
                
                # Section-aware setter: `enable` appears in more than one section,
                # so a bare sed would corrupt unrelated settings. The doc's own
                # one-liner is not section-scoped; this is.
                set_sec() {
                  f="$1"; sec="$2"; key="$3"; val="$4"
                  awk -v sec="[$sec]" -v key="$key" -v val="$val" '"'"'
                    /^\[/ { cur = $1 }
                    { if (cur == sec && $0 ~ "^"key"[ ]*=") { print key " = " val; next } print }
                  '"'"' "$f" > "$f.tmp"
                  mv "$f.tmp" "$f"
                }
                set_sec "$CRONOS_HOME/config/config.toml" statesync enable       true
                set_sec "$CRONOS_HOME/config/config.toml" statesync rpc_servers  "\"$SNAP_RPC,$SNAP_RPC\""
                set_sec "$CRONOS_HOME/config/config.toml" statesync trust_height "$TRUST_HEIGHT"
                set_sec "$CRONOS_HOME/config/config.toml" statesync trust_hash   "\"$TRUST_HASH\""
                set_sec "$CRONOS_HOME/config/config.toml" statesync trust_period '"'"'"168h0m0s"'"'"'
              fi


              echo "[configure] ---- app.toml ----"
              grep -E '^(pruning|minimum-gas-prices|app-db-backend|query-gas-limit)' "$CRONOS_HOME/config/app.toml" || true
              grep -A2 '^\[json-rpc\]' "$CRONOS_HOME/config/app.toml" | grep enable || true
              echo "[configure] ---- config.toml ----"
              grep -E '^(db_backend|laddr|pex|seeds|persistent_peers|enable|rpc_servers|trust_height) ' "$CRONOS_HOME/config/config.toml" || true
              echo "[configure] DONE"
          volumeMounts:
            - name: cronos-data
              mountPath: /data


      containers:
        - name: cronosd
          # ubuntu:22.04 — matches the original Dockerfile base image.
          # The cronosd binary is installed by init-install-cronosd at /data/bin/cronosd.
          # This container just executes `cronosd start` — identical to
          # the entrypoint.sh `exec cronosd start --home "$CRONOS_HOME"`.
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          command: ["/data/bin/cronosd"]     # Binary on PVC (installed by init-install-cronosd)
          args:
            - "start"
            - "--home=/data/.cronos"          # Matches entrypoint.sh CRONOS_HOME="/data/.cronos"
            - "--rpc.laddr=tcp://0.0.0.0:26657"   # K8s: bind CometBFT RPC to all interfaces
            # gRPC and API disabled for crash diagnosis — crash happens right after gRPC starts.
            # Re-enable once node is stable: add --api.enable=true --grpc.enable=true
            # - "--api.enable=true"
            # - "--api.address=tcp://0.0.0.0:1317"
            # - "--grpc.enable=true"
            # - "--grpc.address=0.0.0.0:9090"
          env:
            - { name: MONIKER,      value: "pegasus-node" }
            - { name: CRONOS_HOME,  value: "/data/.cronos" }
            - { name: GOTRACEBACK,  value: "crash" }  # Force full CGO goroutine dump on SIGSEGV
          ports:
            - name: p2p
              containerPort: 26656          # CometBFT P2P — protocol-fixed, never change
              protocol: TCP
            - name: rpc
              containerPort: 26657          # CometBFT RPC — protocol-fixed
              protocol: TCP
            - name: cosmos-api
              containerPort: 1317           # Cosmos REST API — protocol-fixed
              protocol: TCP
            - name: grpc
              containerPort: 9090           # Cosmos gRPC — protocol-fixed
              protocol: TCP
            - name: evm-rpc
              containerPort: 8545           # EVM JSON-RPC HTTP (eth_, debug_trace*)
              protocol: TCP
            - name: evm-ws
              containerPort: 8546           # EVM JSON-RPC WebSocket
              protocol: TCP
            - name: prometheus
              containerPort: 26660          # Prometheus metrics
              protocol: TCP
          resources:
            requests:
              cpu: "250m"                   # Scheduling reservation — keeps the pod schedulable
                                            # on shared cluster nodes alongside other chain pods.
                                            # The node will burst to the limit when syncing.
              memory: "1Gi"                 # Scheduling reservation — same reasoning as cpu above
            limits:
              cpu: "4"                      # Max CPU burst (4-core per Cronos official docs)
              memory: "16Gi"               # Max memory — raise to 32Gi+ for heavy debug_trace workloads
          # CometBFT /health is the correct probe — tcpSocket on P2P stays
          # green through a total freeze (P2P listener never closes).
          startupProbe:
            httpGet:
              path: /health
              port: rpc
            periodSeconds: 15
            failureThreshold: 120           # up to 30 min for store open after restore
          readinessProbe:
            httpGet:
              path: /health
              port: rpc
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: rpc
            initialDelaySeconds: 1800       # Give 30 min before liveness starts
            periodSeconds: 600
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: cronos-data
              mountPath: /data              # Matches Dockerfile VOLUME ["/data"]


      volumes:
        - name: cronos-data                 # Backed by the PVC in 02-node_cronos_pvc.yaml
          persistentVolumeClaim:
            claimName: node-cronos-data     # Must match PVC name in 02-node_cronos_pvc.yaml



