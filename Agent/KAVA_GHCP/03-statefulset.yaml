# ─────────────────────────────────────────────────────────────────────────────
# 03-node_kava_statefulset.yaml — KAVA mainnet full node
#
# Source VM : 10.202.14.113   Chain ID : kava_2222-10
#
# THREE DECISIONS THAT DIFFER FROM THE COMPOSE FILE. Read these before editing.
#
#  1. IMAGE: rocksdb:9.3.3  ->  kava/kava:v0.28.2-goleveldb
#     rocksdb:9.3.3 is a LOCAL BUILD TAG (built on the VM from the Kava repo's
#     dockerfile-rocksdb). It exists on no registry, so the pod can never pull
#     it. The official image is public and version-matched to the live network.
#
#  2. DB BACKEND: rocksdb  ->  goleveldb.  NOT a preference -- it is forced:
#       * kava/kava publishes NO rocksdb tag for v0.28.1 or v0.28.2.
#         Only v0.28.0-rocksdb exists, and v0.28.0 is two releases behind.
#       * The Polkachu snapshot restored below is goleveldb.
#     A goleveldb binary CANNOT open a RocksDB store, or vice versa.
#     >> MIGRATION CONSEQUENCE: the prod VM's chain data is RocksDB, so it
#        CANNOT be disk-snapshotted onto this node. Moving prod data later
#        means either building a rocksdb image yourself, or re-syncing. <<
#
#  3. PRUNING: nothing (archive)  ->  custom (pruned).
#     Kava's own docs require, for an ARCHIVE node:
#         "at least 128GB of dedicated memory (256GB is optimal)"
#         disk "around 6TB uncompressed, ideally 12TB", +100 GB/month
#     This pod has a 4-16Gi memory ceiling and a 100Gi PVC. Archive is not
#     merely tight here, it is impossible. This is a PRUNED node.
#     Archive needs its own node pool and its own disk design -- separate task.
#
# VERIFIED AGAINST THE LIVE NETWORK (not assumed):
#   chain-id   kava_2222-10        app  kava 0.28.2
#   cosmos-sdk v0.47.15            evm  evmos/ethermint v0.21.0
#   cometbft   v0.37.18 (kava fork)
#   block time ~5.71s (~15,100/day)
#
# Init flow, each step idempotent:
#   restore-snapshot (root)  Polkachu pruned snapshot, streamed into the PVC
#   configure        (1000)  kava init -> genesis -> config.toml / app.toml
#   kava-node        (1000)  kava start
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1               # Stable API version for StatefulSet resources
kind: StatefulSet
metadata:
  name: node-kava                  # StatefulSet name — pod will be named node-kava-0
  namespace: kava                  # Must match namespace in 00-namespace.yaml
  labels:
    blockchain: kava               # Protocol identifier
    node: node_kava                # Node identifier used by all services as selector
    managed-by: manifest-generator
spec:
  serviceName: node-kava           # Must match the headless Service name in 04-service.yaml
  replicas: 1                      # Single replica — blockchain nodes do not horizontally scale
  selector:
    matchLabels:
      node: node_kava              # Must match pod template labels below
  template:
    metadata:
      labels:
        blockchain: kava           # Protocol identifier on the pod
        node: node_kava            # Used by all three Services as the selector
    spec:
      enableServiceLinks: false    # k8s <SVC>_PORT env vars have collided with cosmos/viper lookups
      securityContext:
        runAsNonRoot: false        # Kept — the snapshot init container needs root to apk add lz4
        fsGroup: 1000              # Ensures mounted PVC at /kava/.kava is writable by container user
        fsGroupChangePolicy: OnRootMismatch  # Default re-chowns the whole tree on EVERY start
      terminationGracePeriodSeconds: 600  # Was 60. kava must flush its store; SIGKILL mid-write
                                          # corrupts it and costs a 35 GiB re-restore.

      initContainers:

        # --- 1. Prepare volume for STATE SYNC -------------------------------
        # WHY STATE SYNC AND NOT A SNAPSHOT RESTORE:
        #   The Polkachu snapshot restores a 44 GB store (32.4 GB
        #   application.db + 8.4 GB state.db). Opening that store needed more
        #   memory than this cluster can give: measured at 10Gi -> 90%,
        #   20Gi -> 98.5%, 24Gi -> still insufficient, each attempt reading
        #   26+ GB off a flat-500-IOPS disk over ~2 hours before dying.
        #   Kava's own docs ask for 64 GB on a pruned node and they are right.
        #
        #   State sync sidesteps it entirely: the node fetches only CURRENT
        #   app state from a snapshot-serving peer. No 35 GiB download, no
        #   44 GB store to open, a far smaller working set, and CometBFT
        #   starts the RPC listener BEFORE state sync runs -- so the startup
        #   probe passes in minutes instead of never.
        #
        # The wipe below is deliberate and ONE-SHOT, keyed on
        # RESET_FOR_STATESYNC. The token is recorded on the volume once
        # honoured, so a crashloop cannot re-wipe. To force another reset,
        # change the value.
        # Runs as UID 1000, NOT root. It installs nothing, so it never needed
        # root -- that was inherited from the old snapshot-restore container,
        # which needed `apk add lz4`.
        #
        # Running it as root actively BREAKS it: root here has ALL capabilities
        # dropped, so no CAP_DAC_OVERRIDE and no CAP_FOWNER. State sync writes
        # its store as UID 1000 (application.db/ and friends are 1000-owned),
        # and a capability-dropped root cannot descend into those directories
        # to delete them. `rm -rf` fails, `set -e` exits, Init:CrashLoopBackOff.
        #
        # As UID 1000 it owns everything it needs to remove, and /kava/.kava is
        # group-writable via fsGroup: 1000, so it can unlink and recreate data/.
        - name: prepare-statesync
          image: kava/kava:v0.28.2-goleveldb
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            # Changing this value wipes data/ once and lets state sync run again.
            - { name: RESET_FOR_STATESYNC, value: "statesync-3" }
            # ADOPT_EXISTING=true -> never wipe, use whatever is on the volume.
            # This is the switch for a prod-data migration.
            - { name: ADOPT_EXISTING,      value: "false" }
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              HOME_DIR=/kava/.kava
              TOKENFILE="$HOME_DIR/.statesync-reset-token"

              mkdir -p "$HOME_DIR"

              # /etc/passwd shim for UID 1000 (some cosmos paths consult os/user)
              cat > /passwd-vol/passwd <<'PASSWD'
              root:x:0:0:root:/root:/bin/sh
              nobody:x:65534:65534:nobody:/nonexistent:/sbin/nologin
              kava:x:1000:1000:kava:/kava:/bin/sh
              PASSWD
              echo "[prepare] passwd shim written"

              if [ "${ADOPT_EXISTING:-false}" = "true" ]; then
                echo "[prepare] ADOPT_EXISTING=true -- leaving the volume untouched"
                exit 0
              fi

              TOKEN="${RESET_FOR_STATESYNC:-}"
              SEEN="$(cat "$TOKENFILE" 2>/dev/null || true)"
              if [ -z "$TOKEN" ]; then
                echo "[prepare] RESET_FOR_STATESYNC empty -- leaving the volume untouched"
                exit 0
              fi
              if [ "$TOKEN" = "$SEEN" ]; then
                echo "[prepare] reset token '$TOKEN' already honoured -- nothing to do"
                exit 0
              fi

              echo "[prepare] reset token '$TOKEN' is new -- clearing data/ for state sync"
              echo "[prepare] state sync REQUIRES an empty data dir; CometBFT skips it otherwise"
              du -sh "$HOME_DIR/data" 2>/dev/null || true

              # Clear data/ WITHOUT depending on who owns what inside it.
              #
              # Deleting a file needs write+execute on its PARENT DIRECTORY,
              # not ownership of the file. Those directories have been created
              # by different UIDs across attempts (root during snapshot
              # restore, 1000 during state sync), so a plain `rm -rf` has
              # failed with "Permission denied" more than once here.
              #
              # RENAMING data/ only needs write on $HOME_DIR itself, which is
              # group-writable via fsGroup: 1000 and therefore always works for
              # every container in this pod. So: try rm, and if anything
              # survives, move it aside instead. Either way state sync gets the
              # empty data/ it requires.
              rm -rf "$HOME_DIR/data" 2>/dev/null || true
              if [ -d "$HOME_DIR/data" ]; then
                STAMP=$(cat /proc/sys/kernel/random/uuid 2>/dev/null | cut -c1-8 || echo old)
                echo "[prepare] rm was blocked -- moving data/ aside as data.discard.$STAMP"
                mv "$HOME_DIR/data" "$HOME_DIR/data.discard.$STAMP"
              fi
              # Best-effort reclaim of anything moved aside on a previous run.
              # Non-fatal: whatever cannot be removed is retried next boot.
              for d in "$HOME_DIR"/data.discard.*; do
                if [ -d "$d" ]; then
                  echo "[prepare] reclaiming $d"
                  rm -rf "$d" 2>/dev/null || echo "[prepare] could not fully remove $d -- disk still held"
                fi
              done
              mkdir -p "$HOME_DIR/data"
              # priv_validator_state.json must exist or the node refuses to start.
              echo '{"height":"0","round":0,"step":0}' > "$HOME_DIR/data/priv_validator_state.json"
              # addrbook from the old attempt is stale; let pex rebuild it.
              rm -f "$HOME_DIR/config/addrbook.json" 2>/dev/null || true
              # chmod ONLY data/, which this container just created and
              # therefore owns. NOT -R on $HOME_DIR: config/ holds files
              # written by the previous `configure` run as UID 1000, and this
              # container is root with ALL capabilities dropped -- no
              # CAP_FOWNER -- so it cannot chmod a file it does not own. A
              # recursive chmod over $HOME_DIR fails there and, under `set -e`,
              # kills the script. That is an Init:Error crashloop.
              chmod -R a+rwX "$HOME_DIR/data" || true   # we own it now; never fatal
              printf '%s' "$TOKEN" > "$TOKENFILE"
              chmod a+rw "$TOKENFILE" || true
              df -h "$HOME_DIR"
              echo "[prepare] DONE -- volume ready for state sync"
          volumeMounts:
            - { name: kava-data,  mountPath: /kava/.kava }
            - { name: passwd-vol, mountPath: /passwd-vol }

        # --- 2. Config init + TOML patch ------------------------------------
        # Runs as UID 1000, the same identity as the main container. The image
        # CMD is just ["kava"] -- there is no entrypoint that re-renders config
        # on boot, so hand-edited TOMLs are safe here; nothing overwrites them.
        - name: configure
          image: kava/kava:v0.28.2-goleveldb
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "2Gi"        # genesis.json is 210 MB; parsing it needs headroom
          env:
            - { name: HOME,    value: "/kava" }
            - { name: MONIKER, value: "node-kava" }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              HOME_DIR=/kava/.kava
              CFG="$HOME_DIR/config"
              CHAIN_ID="kava_2222-10"
              GENESIS_URL="https://kava-genesis-files.s3.us-east-1.amazonaws.com/kava_2222-10/genesis.json"

              # Seeds from the cosmos chain-registry.
              SEEDS="ade4d8bc8cbe014af6ebdf3cb7b1e9ad36f412c0@seeds.polkachu.com:13956,ebc272824924ea1a27ea3183dd0b9ba713494f83@kava-mainnet-seed.autostake.com:26656,7ab4b78fbe5ee9e3777b21464a3162bd4cc17f57@seed-kava-01.stakeflow.io:1206,8542cd7e6bf9d260fef543bc49e59be5a3fa9074@seed.publicnode.com:26656,10ed1e176d874c8bb3c7c065685d2da6a4b86475@seed-kava.ibs.team:16677"

              # PERSISTENT PEERS -- required, and REACHABILITY-TESTED.
              #
              # `seeds` alone is not enough: a CometBFT seed answers one PEX
              # request then hangs up on purpose (p2p/pex/pex_reactor.go), so a
              # seeds-only node holds 1-2 peers and stalls.
              #
              # But a harvested peer list is not enough either. The first list
              # here was taken straight from a public /net_info and MOST OF IT
              # WAS DEAD -- the node ended up with numOutPeers=1 and state sync
              # died at chunk 230/232 with no fallback peer. Only ~56% of
              # harvested peers were dialable from this cluster.
              #
              # Every entry below was verified reachable FROM THIS POD on
              # 2026-08-27 with:
              #   kubectl exec ... -- sh -c 'for i in <ips>; do
              #     nc -z -w 3 $i 26656 && echo $i OK; done'
              # and its node ID cross-checked against live /net_info.
              #
              # RE-TEST with that same loop before trusting a refreshed list.
              # Peers churn; a list that is merely harvested is not a list that
              # works.
              PPEERS="508d7ec33c7f3c9c479ca9b845cadbbefee670f7@91.134.37.131:26656,8d57aed1934c5466ef07ceaf9b91aa635b76c38f@94.155.47.54:26656,5493de09e7fc23c1fef0fc2075aa15ee1a58f087@77.74.195.236:26656,2198bb3bf989304a90efd2fbe280692597181206@5.180.82.117:26656,80198fc0e14e00046e6b1a6dff6715cf0ed23ec0@176.103.222.15:26656,6d996747eaaef37c0010c1f49c2b1b85391d15c4@169.155.170.153:26656,d34d768d47d9589e08c5d4da308931ed345835e2@80.11.128.70:26656,0d1cd4dc695fd432ef1cb09bdaa276343c390c78@173.231.40.234:26656,a4b1509a84c1beeb4b8eb09fcb3bdcb4db96595f@167.86.78.243:26656"

              if [ ! -f "$CFG/config.toml" ]; then
                echo "[configure] kava init"
                kava init "$MONIKER" --chain-id "$CHAIN_ID" --home "$HOME_DIR"
              else
                echo "[configure] config.toml present -- reconfiguring in place"
              fi

              # Genesis is ~210 MB. Cached on the PVC; re-fetched only if
              # missing or implausibly small.
              GEN="$CFG/genesis.json"
              SZ=$(stat -c %s "$GEN" 2>/dev/null || echo 0)
              if [ "$SZ" -gt 200000000 ]; then
                echo "[configure] genesis present ($SZ bytes) -- skipping"
              else
                echo "[configure] downloading genesis (~210 MB)"
                curl -fsSL --retry 5 --retry-delay 5 --max-time 900 -o "$GEN" "$GENESIS_URL"
                echo "[configure] genesis $(stat -c %s "$GEN") bytes"
              fi

              # Section-aware TOML setter. `enable` appears under [api], [grpc],
              # [grpc-web], [state-sync] AND [json-rpc]; a bare sed hits them all.
              set_sec() {
                f="$1"; sec="$2"; key="$3"; val="$4"
                awk -v sec="[$sec]" -v key="$key" -v val="$val" '
                  /^\[/ { cur = $1 }
                  { if (cur == sec && $0 ~ "^"key"[ ]*=") { print key " = " val; next } print }
                ' "$f" > "$f.tmp"
                mv "$f.tmp" "$f"
              }

              # ---- config.toml -------------------------------------------
              # Bind RPC to all interfaces; default 127.0.0.1 is unreachable
              # from a Service. [p2p] laddr also ends in "laddr", so match on
              # the port to stay unambiguous.
              sed -i 's|^laddr = "tcp://127.0.0.1:26657"|laddr = "tcp://0.0.0.0:26657"|' "$CFG/config.toml"
              sed -i "s|^seeds = .*|seeds = \"$SEEDS\"|"                                 "$CFG/config.toml"
              sed -i "s|^persistent_peers = .*|persistent_peers = \"$PPEERS\"|"           "$CFG/config.toml"
              sed -i 's|^max_num_outbound_peers = .*|max_num_outbound_peers = 20|'        "$CFG/config.toml"
              sed -i 's|^max_num_inbound_peers = .*|max_num_inbound_peers = 10|'          "$CFG/config.toml"
              # db_backend stays goleveldb, matching the image tag. Setting
              # rocksdb here would make the node unable to open its own store.
              sed -i 's|^db_backend = .*|db_backend = "goleveldb"|'                       "$CFG/config.toml"

              # ---- STATE SYNC ---------------------------------------------
              # Computed fresh at every boot. Harmless once synced: CometBFT
              # detects existing state and skips state sync automatically, so
              # this does not re-sync on restart.
              #
              # rpc_servers needs >= 2 entries for light-client cross-checking;
              # duplicating one server is the documented, accepted practice and
              # is what Polkachu's own guide does.
              #
              # trust_height is rounded DOWN to a multiple of 2000 because
              # Polkachu's state-sync node runs snapshot-interval = 2000 --
              # snapshots only exist at those heights.
              SNAP_RPC="https://kava-rpc.polkachu.com:443"
              # jq, NOT sed. A /block response has 2 "height" fields and 6
              # "hash" fields; a greedy regex silently grabs the wrong one
              # (verified: sed returned last_commit.height and a completely
              # wrong hash). A bad trust_hash fails light-client verification
              # and state sync never starts. The image ships jq -- use it.
              LATEST=$(curl -fsSL --retry 5 --max-time 60 "$SNAP_RPC/block" \
                       | jq -r '.result.block.header.height')
              if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
                echo "[configure] FATAL: could not reach $SNAP_RPC for a trust point"
                exit 1
              fi
              TRUST_HEIGHT=$(( (LATEST - 2000) / 2000 * 2000 ))
              TRUST_HASH=$(curl -fsSL --retry 5 --max-time 60 "$SNAP_RPC/block?height=$TRUST_HEIGHT" \
                           | jq -r '.result.block_id.hash')
              if [ -z "$TRUST_HASH" ] || [ "$TRUST_HASH" = "null" ]; then
                echo "[configure] FATAL: could not fetch trust hash at $TRUST_HEIGHT"
                exit 1
              fi
              echo "[configure] state sync trust point: height=$TRUST_HEIGHT hash=$TRUST_HASH"

              set_sec "$CFG/config.toml" statesync enable       true
              set_sec "$CFG/config.toml" statesync rpc_servers  "\"$SNAP_RPC,$SNAP_RPC\""
              set_sec "$CFG/config.toml" statesync trust_height "$TRUST_HEIGHT"
              set_sec "$CFG/config.toml" statesync trust_hash   "\"$TRUST_HASH\""
              set_sec "$CFG/config.toml" statesync trust_period '"168h0m0s"'

              # CHUNK TIMEOUTS -- raised from the CometBFT defaults.
              #
              # Two state-sync attempts died at exactly the SAME place: every
              # chunk applied except the LAST one (fetched, never delivered),
              # after which CometBFT abandoned the snapshot and fell back to a
              # 10-million-block-older one. Twice at the final chunk is not
              # peer flakiness.
              #
              # chunk_request_timeout defaults to 10s (config.go:918). If the
              # single peer serving that snapshot is slow on the last chunk,
              # 10s is not enough and the whole snapshot is discarded. 60s
              # costs nothing when chunks arrive quickly.
              #
              # discovery_time defaults to 15s (config.go:917). Raising it to
              # 30s lets the node find MORE snapshot providers before it
              # commits to one, so a stalled chunk can be re-requested
              # elsewhere instead of killing the attempt.
              set_sec "$CFG/config.toml" statesync chunk_request_timeout '"60s"'
              set_sec "$CFG/config.toml" statesync discovery_time        '"30s"'

              # ---- app.toml ----------------------------------------------
              # minimum-gas-prices carries BOTH denoms — Kava is an Ethermint
              # chain and needs the EVM denom (akava) alongside ukava. Value
              # from Kava's own node-configuration FAQ.
              sed -i 's|^minimum-gas-prices = .*|minimum-gas-prices = "0.001ukava;1000000000akava"|' "$CFG/app.toml"
              # pruning=custom keep-recent=100 interval=10 — the settings the
              # Polkachu snapshot was produced with. NOT "nothing" (archive).
              sed -i 's|^pruning = .*|pruning = "custom"|'                                "$CFG/app.toml"
              sed -i 's|^pruning-keep-recent = .*|pruning-keep-recent = "100"|'           "$CFG/app.toml"
              sed -i 's|^pruning-interval = .*|pruning-interval = "10"|'                  "$CFG/app.toml"

              set_sec "$CFG/app.toml" api      enable  true
              set_sec "$CFG/app.toml" api      address '"tcp://0.0.0.0:1317"'
              set_sec "$CFG/app.toml" grpc     enable  true
              set_sec "$CFG/app.toml" grpc     address '"0.0.0.0:9090"'
              set_sec "$CFG/app.toml" grpc-web enable  false
              # Do NOT serve state-sync snapshots to other nodes — costs disk
              # and CPU, and this node is a consumer.
              set_sec "$CFG/app.toml" state-sync snapshot-interval 0
              # EVM JSON-RPC left DISABLED, matching the source compose file
              # (which exposed only 26657/26656/1317). To enable, set this to
              # true, set address to "0.0.0.0:8545", and add the port to the
              # container + Services.
              set_sec "$CFG/app.toml" json-rpc enable false

              echo "[configure] ---- config.toml ----"
              grep -E '^(laddr|seeds|persistent_peers|external_address|db_backend|max_num_(out|in)bound_peers) ' "$CFG/config.toml" || true
              echo "[configure] ---- statesync ----"
              awk '/^\[statesync\]/{f=1} f&&/^(enable|rpc_servers|trust_height|trust_hash|trust_period|chunk_request_timeout|discovery_time) /{print} /^\[/&&!/statesync/{if(f&&++n>0)exit}' "$CFG/config.toml" || true
              echo "[configure] ---- app.toml ----"
              grep -E '^(minimum-gas-prices|pruning)' "$CFG/app.toml" || true
              echo "[configure] DONE"
          volumeMounts:
            - { name: kava-data,  mountPath: /kava/.kava }
            - { name: passwd-vol, mountPath: /etc/passwd, subPath: passwd }

      containers:
        - name: kava-node          # Container name — matches docker-compose service name
          image: kava/kava:v0.28.2-goleveldb   # Official public image, version-matched to the live network
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000        # Matches fsGroup 1000 so restored files are writable
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          command: ["kava"]        # Image CMD is ["kava"]; no entrypoint script to preserve
          args:
            - "start"              # Subcommand — starts the full node
            - "--home"             # Data directory flag
            - "/kava/.kava"        # Mapped to PVC mount path below
            # --pruning is deliberately NOT passed. It is set in app.toml as
            # "custom" with keep-recent/interval, which a bare flag cannot
            # express. Passing --pruning here would override that.
          env:
            - { name: HOME, value: "/kava" }
          ports:
            - name: rpc            # Tendermint RPC — block/tx queries; fixed by protocol
              containerPort: 26657
              protocol: TCP
            - name: p2p            # Cosmos P2P — peer discovery and chain sync; fixed by protocol
              containerPort: 26656
              protocol: TCP
            - name: rest           # Cosmos REST/LCD — balance, tx, staking queries; fixed by protocol
              containerPort: 1317
              protocol: TCP
            - name: grpc           # gRPC — enabled in app.toml above
              containerPort: 9090
              protocol: TCP
          # SIZING -- derived from the ACTUAL node pool, measured 2026-08-26.
          #
          #   Node pool          Standard_D8s_v6  (8 vCPU / 32 GiB)
          #   Allocatable        7820m CPU / 29.0 GiB   (after AKS reservations)
          #   Non-kava pods use  ~2.7 GiB actual on this node
          #   => ~26 GiB is genuinely available to this pod
          #
          # MEASURED, twice, during the initial store open:
          #   10Gi -> hit 9.0 GiB (90%) and was still loading.  Too small.
          #   20Gi -> hit 20.2 GiB (98.5%) and was still loading. Too small.
          # At 98.5% the cgroup is in continuous reclaim, which destroys the
          # page cache the IAVL read path depends on -- reads collapsed to
          # ~4.5 MB/s, so the memory ceiling was itself causing the slow load.
          # 24Gi + ~2.9 GiB for everything else = ~27 GiB of 29 GiB allocatable.
          #
          # Kava's docs ask for 64 GB on a default-pruning node. That figure is
          # aimed at production validators under load; this is a pruned full
          # node and 20Gi is a reasonable working budget. If it still OOMKills,
          # the next honest step is a memory-optimised pool (Standard_E8s_v6,
          # 8 vCPU / 64 GiB) rather than squeezing this one further.
          #
          # WATCH: node limits are already overcommitted (95% before this
          # change). Overcommit is normal and only bites if everything peaks at
          # once -- but if the pod is ever rescheduled onto a busier node, check
          # `kubectl top nodes` before assuming 20Gi is still safe there.
          #
          # NO CPU LIMIT, on purpose. CFS throttling on a CometBFT node delays
          # block execution past consensus timeouts and is the classic cause of
          # a node that "runs but falls behind". The request is raised to 2
          # because the measured load phase used ~2.6 CPU.
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              memory: "24Gi"
          # All three probes hit CometBFT's own endpoints. A tcpSocket check on
          # 26656 (the previous config) reports healthy through a total freeze,
          # because the P2P listener never closes.
          # STARTUP PROBE -- deliberately very generous. MEASURED: a 40-minute
          # window (160 x 15s) was NOT enough. The node was killed mid-load
          # with "failed startup probe / connection refused (x161 over 43m)"
          # and then restart-looped, throwing away 40 min of work each cycle.
          #
          # Opening a 43 GB goleveldb store on StandardSSD_LRS -- flat ~500
          # IOPS regardless of disk size -- plus reading and hashing a 210 MB
          # genesis.json is I/O-bound and slow. CronosPOS opens a 12 GB store,
          # which is why 40 min sufficed there and does not here.
          #
          # 360 x 30s = 3 HOURS. A startup probe that is too generous costs
          # nothing (the pod simply stays not-Ready, and liveness/readiness
          # stay disabled until it passes). One that is too small is fatal:
          # the node can never finish starting. Err long.
          # With state sync the RPC listener starts BEFORE the sync runs
          # (CometBFT node.OnStart calls startRPC() first), so /health answers
          # within minutes -- the 40-minute silent store-open is gone. 60 min
          # is still generous: the 210 MB genesis is parsed before RPC starts.
          startupProbe:
            httpGet: { path: /health, port: rpc }
            periodSeconds: 30
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: rpc }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          # HEIGHT-PROGRESS liveness. Restarting a node that is merely BEHIND
          # does not help, but a STALLED node has nothing else to recover it.
          # Fires only after the height fails to move across three consecutive
          # 10-minute checks. At ~5.7s blocks a syncing node does >100/min, so
          # a false positive is not plausible.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  H=$(curl -s --max-time 10 http://localhost:26657/status \
                      | jq -r '.result.sync_info.latest_block_height')
                  P=$(cat /tmp/last_height 2>/dev/null || echo 0)
                  echo "$H" > /tmp/last_height
                  [ -n "$H" ] && [ "$H" -gt "$P" ]
            initialDelaySeconds: 2400
            periodSeconds: 600
            timeoutSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: kava-data      # Must match volume name in volumes section below
              mountPath: /kava/.kava  # Matches --home flag in args and original compose bind mount
            - name: passwd-vol
              mountPath: /etc/passwd
              subPath: passwd
      volumes:
        - name: kava-data          # Volume backed by the PVC in 02-pvc.yaml
          persistentVolumeClaim:
            claimName: node-kava-data  # Must match PVC name in 02-pvc.yaml
        - name: passwd-vol         # /etc/passwd shim for UID 1000
          emptyDir: {}
