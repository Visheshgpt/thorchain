# =============================================================================
# 04-node_cronospos_service.yaml — THREE services for CronosPOS
#
# Service 1: node-cronospos        — Headless ClusterIP (required by StatefulSet)
# Service 2: node-cronospos-lb     — Internal LB for P2P (port 26656)
# Service 3: node-cronospos-rpc-lb — Internal LB for all API/RPC ports
#
# IP SHARING NOTE:
#   CronosPOS P2P is fixed at 26656 (Cosmos SDK protocol).
#   This port CANNOT be shared with any other Cosmos SDK chain on the same IP.
#   IP sharing is only valid when the other node uses completely different ports
#   (e.g. Bitcoin 8333, Litecoin 9333). Use --p2p-lb-ip only in that case.
# =============================================================================
---
# --- Service 1: Headless ClusterIP -------------------------------------------
# Required by StatefulSet for stable pod DNS.
# Pod DNS: node-cronospos-0.node-cronospos.cronospos.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: node-cronospos              # Headless service — must match StatefulSet.spec.serviceName
  namespace: cronospos              # Must match namespace in 00-node_cronospos_namespace.yaml
  labels:
    blockchain: cronospos
    node: node_cronospos
    managed-by: manifest-generator
spec:
  clusterIP: None                   # Headless — no virtual IP; DNS resolves directly to pod IP
  publishNotReadyAddresses: true    # LOGIC FIX — the pod is NOT Ready for the whole startup window,
                                    # and needs stable DNS throughout it.
                                    #
                                    # Readiness is now gated behind a startupProbe that allows up to
                                    # 30 min for the store to open after an 8.7 GB snapshot restore.
                                    # Kubernetes holds readiness FALSE until a startupProbe succeeds,
                                    # so for that window the pod has no DNS record and
                                    # node-cronospos-0.node-cronospos.cronospos.svc.cluster.local does
                                    # not resolve — the StatefulSet loses its stable identity exactly
                                    # when you most want to reach it. This flag fixes that.
                                    #
                                    # NOTE on what /health means: CometBFT's Health handler returns an
                                    # empty 200 unconditionally and does NOT inspect sync state (see
                                    # rpc/core/health.go). So once the startupProbe clears, the pod
                                    # reports Ready even while it is still catching up.
                                    # READY IS NOT SYNCED — judge sync from
                                    # /status .sync_info.catching_up and the height gap, never from
                                    # the pod's Ready column.
  selector:
    node: node_cronospos            # Routes to pods with this label
  ports:
    - name: p2p                     # Cosmos P2P — protocol-fixed port
      port: 26656
      targetPort: 26656
      protocol: TCP
    - name: rpc                     # Tendermint RPC — protocol-fixed port
      port: 26657
      targetPort: 26657
      protocol: TCP
    - name: cosmos-api              # Cosmos REST API — protocol-fixed port
      port: 1317
      targetPort: 1317
      protocol: TCP
    - name: grpc                    # gRPC API — protocol-fixed port
      port: 9090
      targetPort: 9090
      protocol: TCP
---
# --- Service 2: Internal LoadBalancer — P2P ----------------------------------
# Exposes the Cosmos P2P port (26656) via Azure Internal Load Balancer.
# External P2P access requires a port enable request via DevOps/firewall team
# — do NOT remove the internal annotation without approval.
#
# REVIEW NOTE — this Service currently buys nothing, and costs a VNet IP.
#   An INTERNAL LB hands out an RFC1918 address. CronosPOS peers live on the
#   public internet and cannot dial an RFC1918 address, so no inbound peering
#   can ever arrive here. A full node needs only OUTBOUND p2p, which already
#   works from the pod IP via the cluster's egress path with no Service at all.
#   The node syncs fine without this.
#
#   It is left in place because it is not harmful to correctness, and because
#   the DevOps port-enable request referenced above may be pending. Two things
#   to know while it exists:
#     - it consumes one private VNet address; if the AKS subnet is short of
#       addresses, EXTERNAL-IP stays <pending> and a SyncLoadBalancerFailed
#       event fires every few minutes;
#     - inbound p2p is ALL-OR-NOTHING. Making it work needs a PUBLIC IP *and*
#       external_address set to that public IP in config.toml. The configure
#       init container deliberately leaves external_address EMPTY. Do both or
#       neither — advertising an address peers cannot reach gets the node
#       deprioritised and dropped, which is worse than advertising nothing.
#
#   Delete this whole Service if the port-enable request is not going ahead.
apiVersion: v1
kind: Service
metadata:
  name: node-cronospos-lb           # Primary LB service name
  namespace: cronospos
  labels:
    blockchain: cronospos
    node: node_cronospos
    managed-by: manifest-generator
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"  # Private VNet IP only — MUST NOT be removed
spec:
  type: LoadBalancer                # Azure provisions an Internal LB with a private VNet IP
  selector:
    node: node_cronospos
  ports:
    - name: p2p                     # Cosmos P2P — fixed by protocol at 26656, never change
      port: 26656                   # LB listener port (external:internal from compose = 26656:26656)
      targetPort: 26656             # Container port
      protocol: TCP
---
# --- Service 3: Internal LoadBalancer — RPC / API ----------------------------
# Exposes all API and RPC ports via Azure Internal Load Balancer.
# These ports must NEVER be exposed publicly — VNet access only.
#
# REVIEW NOTE — the non-standard frontend ports below are CORRECT, keep them.
#   Using 1332/2332/3332 as LB listener ports (rather than 26657/1317/9090)
#   is what makes this node's port set DISJOINT from every other Cosmos chain,
#   which is the precondition for sharing one LB IP. Several Services may share
#   a single frontend IP only if their port sets do not overlap; every Cosmos
#   chain defaults to 26657/1317/9090, so chains left on standard ports collide
#   and the Service sticks in SyncLoadBalancerFailed.
#   targetPort stays the real container port, so the node itself is untouched.
apiVersion: v1
kind: Service
metadata:
  name: node-cronospos-rpc-lb       # RPC/API LB service name
  namespace: cronospos
  labels:
    blockchain: cronospos
    node: node_cronospos
    managed-by: manifest-generator
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"  # Private VNet IP — required for all API ports
spec:
  type: LoadBalancer                # Azure provisions an Internal LB with a private VNet IP
  selector:
    node: node_cronospos
  ports:
    - name: rpc                     # Tendermint RPC — external:internal from compose = 1332:26657
      port: 1332                    # LB listener port (as declared in compose)
      targetPort: 26657             # Container port — protocol-fixed, never change
      protocol: TCP
    - name: cosmos-api              # Cosmos REST API — external:internal from compose = 2332:1317
      port: 2332                    # LB listener port (as declared in compose)
      targetPort: 1317              # Container port — protocol-fixed, never change
      protocol: TCP
    - name: grpc                    # gRPC API — external:internal from compose = 3332:9090
      port: 3332                    # LB listener port (as declared in compose)
      targetPort: 9090              # Container port — protocol-fixed, never change
      protocol: TCP



