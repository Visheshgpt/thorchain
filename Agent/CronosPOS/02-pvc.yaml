# ============================================================
# PVC for the chain home (/chain-home).
#
# SIZING
#   Polkachu pruned snapshot, compressed ....  8.7 GB
#     (measured: content-length 8,714,727,213)
#   Extracted pruned state ..................  ~18-22 GB
#     (lz4 on Cosmos state runs ~2-2.5x)
#   chain-maind binary ......................  ~192 MB
#   Growth, pruning="custom" keep-recent=100    ~2-5 GB / month
#     (17,000 blocks/day; blockstore dominates)
#
#   12-month working set  ~=  22 + 48  =  ~70 GB   ->  128Gi
#
# The 8.7 GB tarball is NEVER written to this disk -- the
# restore streams curl | lz4 -d | tar -x straight into the
# volume. That is why 128Gi is enough where a staged
# download-then-extract would need ~200Gi.
#
# On StandardSSD_LRS, IOPS are FLAT (~500) regardless of size,
# so unlike Premium there is no performance reason to size up.
# 128Gi is a pure capacity decision.
#
# Online expansion is available (allowVolumeExpansion: true).
# Never shrink -- Azure disks cannot.
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chain-maind-data
  namespace: cronospos
  labels:
    app: chain-maind
    blockchain: cronospos
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cronospos-storage
  resources:
    requests:
      storage: 128Gi
