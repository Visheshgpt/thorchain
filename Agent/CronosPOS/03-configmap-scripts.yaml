# ============================================================
# Init-container scripts.
#
# WHY THERE IS A BINARY DOWNLOAD HERE AT ALL
#
#   The compose file references cryptocom/chain-main:v8.0.0.
#   That image is NOT publicly pullable -- every tag returns
#   HTTP 401 on Docker Hub (4 namespaces tried) and on GHCR,
#   while library/busybox and library/alpine return 200 through
#   the identical probe. It is a LOCAL BUILD TAG: upstream's
#   own Dockerfile opens with
#       # > docker build -t cryptocom/chain-main .
#   so the prod VM built it on the box. Nothing was published.
#
#   Upstream's v8.0.0 release binary is FULLY STATIC
#   (no PT_INTERP, no PT_DYNAMIC -- verified on the artifact),
#   so it runs on any Linux base image. We therefore download
#   and SHA256-verify the official binary and run it on public
#   alpine. No ACR, no build pipeline, no private registry.
#
#   TRAP, if you ever do build the image instead: upstream's
#   Dockerfile declares ARG NETWORK=testnet, which overrides
#   the Makefile's own `NETWORK ?= mainnet`. Building it with
#   defaults produces a TESTNET binary that will never join
#   mainnet. Build with --build-arg NETWORK=mainnet.
#
# ORDER: bootstrap.sh (root) MUST run before configure.sh
# (UID 1025). bootstrap is root with capabilities dropped, so
# it has no CAP_DAC_OVERRIDE and cannot write into a directory
# owned by 1025. Running it first means every file is created
# by root, and the closing `chmod -R a+rwX` hands write access
# to 1025. Reverse the order and configure.sh's output blocks
# the restore with "Permission denied".
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: chain-maind-scripts
  namespace: cronospos
  labels:
    app: chain-maind
    app.kubernetes.io/part-of: cronospos-fullnode
data:

  # ----------------------------------------------------------
  # bootstrap.sh -- runs as root, capabilities dropped.
  #   1. /etc/passwd shim for UID 1025
  #   2. chain-maind binary, SHA256-verified
  #   3. mainnet genesis.json
  #   4. Polkachu pruned snapshot, STREAMED into the volume
  # Every step is idempotent.
  # ----------------------------------------------------------
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    BIN_VOL=/bin-vol
    HOME_DIR=/chain-home
    SENTINEL="$HOME_DIR/.snapshot-restored"

    BIN_URL="https://github.com/crypto-org-chain/chain-main/releases/download/v8.0.0/chain-main_8.0.0_Linux_x86_64.tar.gz"
    BIN_SHA="61c39edd0216455a2c7a59b429c07d917d92c117cc96ee554484e4f3f8beb0fc"
    GENESIS_URL="https://github.com/crypto-org-chain/mainnet/raw/main/crypto-org-chain-mainnet-1/genesis.json"
    SNAP_PAGE="https://polkachu.com/tendermint_snapshots/cryptocom"
    SNAP_BASE="https://snapshots.polkachu.com/snapshots/cryptocom"

    echo "[bootstrap] installing tools"
    apk add --no-cache curl ca-certificates lz4 tar >/dev/null

    # -- 1. /etc/passwd shim -------------------------------
    # The binary is static Go. Some cosmos code paths consult
    # os/user; a UID with no passwd entry makes that fail.
    # Cheap insurance, mounted over /etc/passwd via subPath.
    cat > /passwd-vol/passwd <<'PASSWD'
    root:x:0:0:root:/root:/bin/sh
    nobody:x:65534:65534:nobody:/nonexistent:/sbin/nologin
    chainmain:x:1025:1025:chainmain:/chain-home:/bin/sh
    PASSWD
    echo "[bootstrap] passwd shim written"

    # -- 2. chain-maind binary -----------------------------
    if [ -x "$BIN_VOL/chain-maind" ]; then
      echo "[bootstrap] binary already present -- skipping"
    else
      echo "[bootstrap] downloading chain-maind v8.0.0 (56 MB)"
      curl -fsSL --retry 5 --retry-delay 5 --max-time 600 -o /tmp/cm.tar.gz "$BIN_URL"
      ACTUAL=$(sha256sum /tmp/cm.tar.gz | cut -d' ' -f1)
      if [ "$ACTUAL" != "$BIN_SHA" ]; then
        echo "[bootstrap] FATAL sha256 mismatch"
        echo "  expected $BIN_SHA"
        echo "  actual   $ACTUAL"
        exit 1
      fi
      echo "[bootstrap] sha256 OK"
      tar -xzf /tmp/cm.tar.gz -C /tmp
      mv /tmp/bin/chain-maind "$BIN_VOL/chain-maind"
      chmod 0755 "$BIN_VOL/chain-maind"
      rm -f /tmp/cm.tar.gz
    fi

    # -- 3. genesis ----------------------------------------
    if [ -f "$BIN_VOL/genesis.json" ]; then
      echo "[bootstrap] genesis already present -- skipping"
    else
      echo "[bootstrap] downloading mainnet genesis"
      curl -fsSL --retry 5 --retry-delay 5 --max-time 300 -o "$BIN_VOL/genesis.json" "$GENESIS_URL"
      chmod 0644 "$BIN_VOL/genesis.json"
    fi

    # -- 4. snapshot ---------------------------------------
    if [ -f "$SENTINEL" ]; then
      echo "[bootstrap] snapshot already restored at height $(cat "$SENTINEL")"
    elif [ -d "$HOME_DIR/data" ] && [ -n "$(ls -A "$HOME_DIR/data" 2>/dev/null || true)" ]; then
      # DO NOT DELETE DATA WE DID NOT PUT THERE. An unguarded
      # rm -rf in an init container is one bad boot away from
      # destroying a migrated chain dir. Fail loudly instead.
      echo "[bootstrap] FATAL: $HOME_DIR/data is populated but has no sentinel."
      echo "[bootstrap] Refusing to overwrite data this script did not create."
      echo "[bootstrap] If this data IS good, run:  touch $SENTINEL"
      exit 1
    else
      echo "[bootstrap] discovering current Polkachu snapshot"
      # Polkachu keeps ONE snapshot and deletes yesterday's, so
      # the filename changes daily and a hardcoded URL 404s
      # within 24h. The v2 API now needs a secret header, so the
      # filename is scraped from the public page instead.
      FILE=$(curl -fsSL --retry 5 --max-time 120 "$SNAP_PAGE" \
             | grep -oE 'cryptocom_[0-9]+\.tar\.lz4' | head -1)
      if [ -z "$FILE" ]; then
        echo "[bootstrap] FATAL: could not discover a snapshot filename."
        echo "[bootstrap] Check $SNAP_PAGE by hand; see RUNBOOK section 7."
        exit 1
      fi
      HEIGHT=$(echo "$FILE" | sed -n 's/cryptocom_\([0-9]*\)\.tar\.lz4/\1/p')
      echo "[bootstrap] selected $FILE (height $HEIGHT, ~8.7 GB)"

      mkdir -p "$HOME_DIR"
      ATTEMPT=0
      while : ; do
        ATTEMPT=$((ATTEMPT + 1))
        if [ "$ATTEMPT" -gt 5 ]; then
          echo "[bootstrap] FATAL: snapshot restore failed after 5 attempts"
          exit 1
        fi
        echo "[bootstrap] streaming attempt $ATTEMPT (15-40 min)"
        # Streamed, never staged: the 8.7 GB tarball is never
        # written down, so the PVC needs no download+extract
        # peak. Cost of streaming is no resume -- hence retries.
        if curl -fL --retry 3 --retry-delay 10 "$SNAP_BASE/$FILE" \
             | lz4 -dc - | tar -x -C "$HOME_DIR" ; then
          # POSIX sh has no pipefail, so tar can exit 0 on a
          # truncated stream. Verify the stores actually landed.
          OK=1
          for d in blockstore.db state.db application.db; do
            if [ ! -d "$HOME_DIR/data/$d" ]; then
              echo "[bootstrap] missing data/$d after extract"
              OK=0
            fi
          done
          if [ "$OK" = "1" ]; then
            echo "[bootstrap] extract verified"
            break
          fi
        fi
        echo "[bootstrap] attempt $ATTEMPT failed -- retrying"
        rm -rf "$HOME_DIR/data"
        sleep 15
      done
      echo "$HEIGHT" > "$SENTINEL"
      echo "[bootstrap] snapshot restored at height $HEIGHT"
    fi

    # Extracted as root; everything after this runs as 1025.
    # CAP_CHOWN is dropped so chown is unavailable, but root can
    # always chmod its own files. a+rwX = rw for all, +x only on
    # directories. Seconds on a pruned tree.
    echo "[bootstrap] chmod -R a+rwX"
    chmod -R a+rwX "$HOME_DIR"
    df -h "$HOME_DIR"
    echo "[bootstrap] DONE"

  # ----------------------------------------------------------
  # configure.sh -- runs as UID 1025, the runtime identity.
  #
  # Hand-editing the TOMLs is SAFE for this chain, which is not
  # true everywhere. chain-main's image CMD is just
  # ["chain-maind"] -- there is no entrypoint that re-renders
  # config on boot, so nothing overwrites what we write here.
  # (On chains that DO ship a render-config entrypoint, editing
  # the TOML is pointless and env overrides are the only way.)
  # ----------------------------------------------------------
  configure.sh: |
    #!/bin/sh
    set -eu

    CM=/bin-vol/chain-maind
    HOME_DIR=/chain-home
    CFG="$HOME_DIR/config"
    CHAIN_ID="crypto-org-chain-mainnet-1"
    MONIKER="${MONIKER:-cronospos-aks}"

    # Seeds from the cosmos chain-registry, verified resolving.
    SEEDS="87c3adb7d8f649c51eebe0d3335d8f9e28c362f2@seed-0.crypto.org:26656,e1d7ff02b78044795371beb1cd5fb803f9389256@seed-1.crypto.org:26656,2c55809558a4e491e9995962e10c026eb9014655@seed-2.crypto.org:26656,8542cd7e6bf9d260fef543bc49e59be5a3fa9074@seed.publicnode.com:26656,ade4d8bc8cbe014af6ebdf3cb7b1e9ad36f412c0@seeds.polkachu.com:20256"

    if [ ! -f "$CFG/config.toml" ]; then
      echo "[configure] chain-maind init"
      "$CM" init "$MONIKER" --chain-id "$CHAIN_ID" --home "$HOME_DIR"
    else
      echo "[configure] config.toml present -- reconfiguring in place"
    fi

    # The genesis init just generated is a throwaway. Replace it
    # with the real mainnet genesis every time -- cheap and it
    # makes a corrupted copy self-healing.
    cp /bin-vol/genesis.json "$CFG/genesis.json"
    echo "[configure] genesis installed ($(wc -c < "$CFG/genesis.json") bytes)"

    # Section-aware TOML setter. `enable` appears under [api],
    # [grpc], [grpc-web] and [state-sync]; a bare sed would hit
    # all four. This tracks the current [section] header.
    set_sec() {
      f="$1"; sec="$2"; key="$3"; val="$4"
      awk -v sec="[$sec]" -v key="$key" -v val="$val" '
        /^\[/ { cur = $1 }
        { if (cur == sec && $0 ~ "^"key"[ ]*=") { print key " = " val; next } print }
      ' "$f" > "$f.tmp"
      mv "$f.tmp" "$f"
    }

    # ---- config.toml ------------------------------------
    # Bind RPC to all interfaces. Default is 127.0.0.1, which
    # is unreachable from a Service. The [p2p] laddr also ends
    # in "laddr", so match on the port to stay unambiguous.
    sed -i 's|^laddr = "tcp://127.0.0.1:26657"|laddr = "tcp://0.0.0.0:26657"|' "$CFG/config.toml"
    sed -i "s|^seeds = .*|seeds = \"$SEEDS\"|"                                 "$CFG/config.toml"
    # 20 out / 10 in. Outbound is what a full node syncs from;
    # inbound is capped low because no LB fronts p2p (see
    # 05-service.yaml) so inbound dials mostly will not arrive.
    sed -i 's|^max_num_outbound_peers = .*|max_num_outbound_peers = 20|'        "$CFG/config.toml"
    sed -i 's|^max_num_inbound_peers = .*|max_num_inbound_peers = 10|'          "$CFG/config.toml"
    sed -i 's|^prometheus = false|prometheus = true|'                           "$CFG/config.toml"

    # ---- app.toml ---------------------------------------
    # pruning=custom keep-recent=100 interval=10 is the
    # smallest safe footprint: last 100 states, swept every 10
    # blocks. "nothing" (archive) is multi-TB and is explicitly
    # NOT what this node is for.
    sed -i 's|^minimum-gas-prices = .*|minimum-gas-prices = "0.025basecro"|'    "$HOME_DIR/config/app.toml"
    sed -i 's|^pruning = .*|pruning = "custom"|'                               "$HOME_DIR/config/app.toml"
    sed -i 's|^pruning-keep-recent = .*|pruning-keep-recent = "100"|'           "$HOME_DIR/config/app.toml"
    sed -i 's|^pruning-interval = .*|pruning-interval = "10"|'                  "$HOME_DIR/config/app.toml"

    set_sec "$CFG/app.toml" api      enable  true
    set_sec "$CFG/app.toml" api      address '"tcp://0.0.0.0:1317"'
    set_sec "$CFG/app.toml" grpc     enable  true
    set_sec "$CFG/app.toml" grpc     address '"0.0.0.0:9090"'
    # grpc-web off: nothing consumes it and it is another
    # listener to secure.
    set_sec "$CFG/app.toml" grpc-web enable  false
    # snapshot-interval 0: do NOT serve state-sync snapshots to
    # other nodes. Producing them costs disk and CPU, and this
    # node is a consumer, not a provider.
    set_sec "$CFG/app.toml" state-sync snapshot-interval 0

    echo "[configure] ---- config.toml ----"
    grep -E '^(laddr|seeds|persistent_peers|external_address|max_num_(out|in)bound_peers|prometheus) ' "$CFG/config.toml" || true
    echo "[configure] ---- app.toml ----"
    grep -E '^(minimum-gas-prices|pruning|pruning-keep-recent|pruning-interval)' "$CFG/app.toml" || true
    echo "[configure] DONE"
