# ============================================================
# THORChain mainnet FULL NODE on AKS -- corrected StatefulSet.
#
# The three changes that actually matter, in order:
#
#  1. IMAGE = mainnet-3.19.3, not mainnet-3.18.1.
#     THORChain's live consensus version is 3.19.3 and has been
#     since block 26,897,608 (check it yourself:
#     https://gateway.liquify.com/chain/thorchain_api/thorchain/version).
#     A 3.18.1 binary does not contain 3.19.x consensus logic,
#     so the moment a 3.19-gated code path executes it computes
#     a different app hash than the network and CometBFT
#     refuses every subsequent block. The node parks on one
#     height forever with catching_up: true. That is the
#     failure you are looking at.
#
#  2. We run the image's OWN entrypoint (/scripts/fullnode.sh).
#     v1 overrode it with `thornode start` to avoid
#     render-config. That was based on a wrong assumption:
#     render-config does NOT overwrite an existing genesis.json
#     (config.go: thornodeFetchGenesis returns early if the
#     file exists), and it is the ONLY thing that populates
#     `seeds` in config.toml. Skipping it is why the node had
#     no usable peers. If you ever do need to pin the TOMLs,
#     the supported way is THORNODE_PRESERVE_CONFIG_TOML /
#     THORNODE_PRESERVE_APP_TOML -- not deleting the entrypoint.
#
#  3. RESOURCES. v1 gave the node cpu limit 1500m / memory
#     limit 3Gi. Upstream's own Helm chart requests 4 CPU and
#     4Gi with NO limits at all. A CPU limit throttles block
#     execution via CFS and wrecks consensus timing; a 3Gi
#     memory cap OOMKills a mainnet thornode. Requests here are
#     4 CPU / 8Gi, with a memory limit only.
#
# Init flow (each step is idempotent):
#   init-passwd    -> /etc/passwd entry for UID 1025
#   init-keys      -> node_key.json + priv_validator_key.json
#   init-snapshot  -> Liquify pruned snapshot into /data/.thornode
#   thornode       -> fullnode.sh: render-config + thornode start
#
# Deliberately NOT set: EXTERNAL_IP. See the note on it below.
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thornode
  namespace: thorchain
  labels:
    app: thornode
    app.kubernetes.io/name: thornode
    app.kubernetes.io/part-of: thornode-fullnode
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: thornode-headless
  replicas: 1
  selector:
    matchLabels:
      app: thornode
  template:
    metadata:
      labels:
        app: thornode
        app.kubernetes.io/name: thornode
    spec:
      # The image reads NET/CHAIN_ID from the environment. Kubernetes'
      # auto-injected <SVC>_PORT vars have collided with cosmos/viper
      # lookups before; turn them off.
      enableServiceLinks: false

      # A THORChain node must flush LevelDB cleanly. SIGKILL mid-write
      # corrupts the store and costs a full snapshot re-restore.
      terminationGracePeriodSeconds: 600

      securityContext:
        fsGroup: 1025
        # Only relabel the volume when the top-level owner is wrong.
        # On a 600 GB / ~1M-file chain dir the default "Always"
        # policy re-chowns everything on every start (10+ minutes).
        fsGroupChangePolicy: OnRootMismatch

      # SHARED-CLUSTER MODE. No nodeSelector -- this cluster is shared
      # with other teams, the pool is at max autoscaler size, and a
      # dedicated pool is not available. See the resources block below
      # for what that costs us.
      #
      # If a dedicated pool ever becomes possible, that is strongly
      # preferred. Create it and re-add the two stanzas:
      #   az aks nodepool add -g <rg> --cluster-name <cluster> \
      #     --name thornode --node-count 1 \
      #     --node-vm-size Standard_D8s_v3 --node-osdisk-size 128 \
      #     --labels workload=thornode \
      #     --node-taints workload=thornode:NoSchedule
      #   nodeSelector: { workload: thornode }
      #   tolerations: [{key: workload, operator: Equal,
      #                  value: thornode, effect: NoSchedule}]

      initContainers:

        # -- 1. /etc/passwd shim for UID 1025 -------------------
        - name: init-passwd
          image: busybox:1.36
          command: ["/bin/sh", "/scripts/init-passwd.sh"]
          securityContext:
            runAsUser: 1025
            runAsGroup: 1025
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { memory: "64Mi" }
          volumeMounts:
            - { name: passwd-vol, mountPath: /passwd-vol }
            - { name: scripts,    mountPath: /scripts }

        # -- 2. snapshot restore -------------------------------
        # Runs as root only because it must `apk add` aria2/tar.
        # It exits before the main container starts; nothing that
        # touches the network long-term runs privileged.
        #
        # ORDER MATTERS -- this MUST run before init-keys.
        #
        # This container is root but with capabilities dropped, which
        # means no CAP_DAC_OVERRIDE: root here canNOT bypass file
        # permissions. `thornode init` writes node_key.json as mode
        # 0600 owned by 1025, so if init-keys ran first this container
        # could not even read it:
        #   cp: can't open '/data/.thornode/config/node_key.json':
        #       Permission denied
        # Running the snapshot first means every file under
        # /data/.thornode is created and owned by root, and the
        # closing `chmod -R a+rwX` then hands write access to 1025 for
        # init-keys and the main container. Root never has to read a
        # file it does not own.
        #
        # Skip this container entirely if you want to sync from
        # genesis instead -- but be aware that is a multi-week
        # replay of 27M+ blocks.
        - name: init-snapshot
          image: alpine:3.19
          command: ["/bin/sh", "/scripts/init-snapshot.sh"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            # "mainnet-pruned" (~40 GB) or "mainnet-archive" (multi-TB).
            - { name: SNAP_TYPE, value: "mainnet-pruned" }
          # MUST NOT exceed the main container's requests. A pod's
          # effective request is max(init requests, sum of app
          # containers) -- an init container asking 500m would set the
          # whole pod's CPU request to 500m and it would stop fitting.
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "2Gi" }
          volumeMounts:
            - { name: thornode-data, mountPath: /data }
            - { name: scripts,       mountPath: /scripts }

        # -- 3. node identity ----------------------------------
        # Runs AFTER the snapshot, as UID 1025 -- the same identity
        # the main container uses, so the keys it writes are readable
        # by it without any chown.
        #
        # Snapshots ship state + genesis but not a usable per-node
        # identity, so generate one here if it is missing. On every
        # later boot node_key.json exists and this exits immediately.
        #
        # `thornode init --overwrite` would clobber the snapshot's
        # genesis.json, so it is saved to /tmp and put back after.
        - name: init-keys
          image: registry.gitlab.com/thorchain/thornode:mainnet-3.19.3
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              CFG="$HOME/.thornode/config"
              if [ -f "$CFG/node_key.json" ]; then
                echo "[keys] node_key.json present -- skipping init"
                exit 0
              fi
              echo "[keys] thornode init local --chain-id $CHAIN_ID"
              if [ -f "$CFG/genesis.json" ]; then
                cp "$CFG/genesis.json" /tmp/genesis.json
                echo "[keys] preserved snapshot genesis.json"
              fi
              thornode init local --chain-id "$CHAIN_ID" --overwrite
              if [ -f /tmp/genesis.json ]; then
                mv /tmp/genesis.json "$CFG/genesis.json"
                echo "[keys] restored snapshot genesis.json"
              fi
              # render-config rewrites both TOMLs at container start;
              # drop the cosmos defaults init just wrote so nothing
              # stale can survive.
              rm -f "$CFG/config.toml" "$CFG/app.toml"
              ls -la "$CFG/"
          securityContext:
            runAsUser: 1025
            runAsGroup: 1025
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: HOME,     value: "/data" }
            - { name: NET,      value: "mainnet" }
            - { name: CHAIN_ID, value: "thorchain-1" }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { memory: "1Gi" }
          volumeMounts:
            - { name: thornode-data, mountPath: /data }
            - { name: passwd-vol,    mountPath: /etc/passwd, subPath: passwd }

      containers:
        - name: thornode
          image: registry.gitlab.com/thorchain/thornode:mainnet-3.19.3
          imagePullPolicy: IfNotPresent

          # NO command / args. The image's CMD is
          # ["/scripts/fullnode.sh"], which does:
          #   ulimit -n 65535
          #   init_chain            (only if genesis.json missing)
          #   thornode render-config
          #   exec thornode start
          # render-config is what resolves live seeds and writes
          # a correct config.toml. Do not bypass it.

          env:
            # THORNode home is always $HOME/.thornode, so HOME=/data
            # puts the whole chain dir on the PVC.
            - { name: HOME,          value: "/data" }
            - { name: NET,           value: "mainnet" }
            - { name: CHAIN_ID,      value: "thorchain-1" }

            # core.sh hard-fails if these are empty. A full node never
            # signs anything, so the values are inert -- but they must
            # exist. (fullnode.sh defaults them; set explicitly so a
            # future entrypoint change cannot surprise us.)
            - { name: SIGNER_NAME,   value: "thorchain" }
            - { name: SIGNER_PASSWD, value: "password" }

            # ---- config overrides -----------------------------
            # Every key in
            #   https://gitlab.com/thorchain/thornode/-/blob/develop/config/default.yaml
            # is settable as an env var: dots become underscores and
            # the whole key is upper-cased. thor.cosmos.pruning ->
            # THOR_COSMOS_PRUNING. This is the supported way to
            # configure THORNode; sed-ing the rendered TOML is not,
            # because render-config rewrites it every boot.

            # "default" = keep last 100 + every 500th state. Matches a
            # mainnet-pruned snapshot and the 600Gi PVC.
            # THORChain's own default is "nothing" (full archive) --
            # that needs 4Ti+ and will fill this disk.
            - { name: THOR_COSMOS_PRUNING, value: "default" }

            # REST/LCD on 1317 and gRPC on 9090.
            - { name: THOR_COSMOS_API_ENABLE,   value: "true" }
            - { name: THOR_COSMOS_GRPC_ENABLE,  value: "true" }
            - { name: THOR_COSMOS_GRPC_ADDRESS, value: "0.0.0.0:9090" }

            # Prometheus on :26660.
            - { name: THOR_TENDERMINT_INSTRUMENTATION_PROMETHEUS, value: "true" }

            # Raised from 8/4 after two blocksync stalls. The original
            # low values were to protect the 3Gi cap, but measurement
            # showed the node sitting at 1.6Gi of 3Gi with 10 peers --
            # memory was never the constraint. A larger pool gives
            # blocksync more block sources to fall back on when one
            # goes quiet.
            - { name: THOR_TENDERMINT_P2P_MAX_NUM_OUTBOUND_PEERS, value: "20" }
            - { name: THOR_TENDERMINT_P2P_MAX_NUM_INBOUND_PEERS,  value: "10" }

            # ---- EXTERNAL_IP: intentionally absent -------------
            # Setting EXTERNAL_IP makes render-config advertise
            #   external_address = "<ip>:27146"
            # to the entire network. v1's runbook told you to set it
            # to the internal Azure LB address -- an RFC1918 address
            # that no THORChain peer on the internet can dial. Peers
            # that fail to dial back deprioritise and eventually drop
            # you, which makes peering worse, not better.
            # A full node needs only OUTBOUND connectivity. Leave this
            # unset unless the pod has a real public IP.

            # ---- peer bootstrap: ENABLED, see README section 4 ----
            # Belt and braces. render-config's own seed discovery
            # should work here, but this removes any dependence on it.
            #
            # Measured from this cluster's pods:
            #   raw TCP to <validator-ip>:27146   -> open
            #   https://gateway.liquify.com:443   -> 200
            #   http://70.34.247.166:27147/status -> 503
            #
            # That 503 is NOT an egress proxy. Probing all 95 active
            # validators from outside the VNet returns 200 on 93 and
            # 503 on 2 -- 70.34.247.166 is simply one of the two whose
            # own RPC reverse-proxy is unhealthy. Egress is fine.
            #
            # Seeds are still worth not depending on: render-config
            # learns each seed's node ID by GETting :27147/status, so
            # a validator that 503s or times out silently drops out of
            # the seed list. persistent_peers carries the node IDs
            # inline, needs no :27147 probe at all, and coexists with
            # discovered seeds.
            #
            # All 20 entries were verified against the live network at
            # the time of writing (node ID matched /status).
            #
            # NOTE: THOR_TENDERMINT_P2P_SEEDS would NOT work here --
            # InitThornode() overwrites .P2P.Seeds unconditionally
            # after config load. PersistentPeers is left alone.
            #
            # Refresh the list if these validators churn out of the
            # active set (see README section 8).
            - name: THOR_TENDERMINT_P2P_PERSISTENT_PEERS
              value: "89865c89d72d6875a8c3b9fd7d0f5de1926e6b2b@68.183.244.113:27146,f18693601ed7ef210cef3f3d9d0ea32445abc4ca@167.235.109.114:27146,64bf8cce2bfccfd00ea313906e13b0c56f9d3ce0@167.235.195.244:27146,0557f43679990f8139502508a8b635c108af9521@173.234.136.17:27146,b466028dc9f8adaf5b91acd17754575d5797c15a@80.91.65.181:27146,3d221ed238859628fc3710ba34ace804ceebf9d8@195.3.223.168:27146,a860e06d1e8b46d9aa30551f69992c91a3f7cc90@45.63.27.5:27146,d1fd0a64df3aa93e363f3a152e44aef8ba025ed1@139.84.141.122:27146,b9d772ed35b15e7cdbfdaff5bafae7655f0ea47b@139.84.196.2:27146,5bf7165cc7a057939e41185fed3f9f070aaf2e13@159.65.195.202:27146,aa9f43f896fd83e8afd14f0b9ae14e0b0c6d0df5@134.209.83.182:27146,110b6fa5a679ef7ab42b4de83a0c738386ded6ac@128.199.7.130:27146,2a5dff3717ec3d747237ffe174e3023f1d2f79b5@164.132.247.225:27146,bbc0b2e34ffbdb3f5ae250072342955766ae3cf0@95.214.55.157:27146,9aa118b30449cc7b77c1a7622d8ea42dc5e92e62@173.234.17.198:27146,3c929fb34a0d28a131d8cb037aa371aa939c4e0d@80.91.65.183:27146,75a5caebbd084e7c416fb4904232158ff90df6dc@144.6.50.251:27146,68580f6ef24fb0d6d620632d61cebc5b8b89c45e@57.129.73.114:27146,8bbcdb36798c57fec6804303693280dd3f18f3d4@46.225.37.189:27146,63ec978880fb2b53ca2a533c866b1fb8ee92a858@167.99.28.69:27146"

            # render-config probes ~95 validator IPs on :27147 at boot.
            # A couple of them 503 or time out; those are log.Error()
            # only, not fatal, so expect some noise in the first
            # minutes of the log. Only getSeedAddrs()' HTTPS call to
            # gateway.liquify.com is log.Fatal() on failure -- if that
            # 443 egress ever breaks, the container crashloops rather
            # than starting peerless.

          ports:
            - { name: p2p,     containerPort: 27146, protocol: TCP }
            - { name: rpc,     containerPort: 27147, protocol: TCP }
            - { name: rest,    containerPort: 1317,  protocol: TCP }
            - { name: grpc,    containerPort: 9090,  protocol: TCP }
            - { name: metrics, containerPort: 26660, protocol: TCP }

          securityContext:
            runAsUser: 1025
            runAsGroup: 1025
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

          # SHARED-CLUSTER RESOURCE PROFILE.
          #
          # Upstream's chart requests 4 CPU / 4Gi. We cannot: measured
          # free capacity across the five nodes is
          #   node1 266m/2166Mi  node2 365m/1221Mi  node3 342m/1046Mi
          #   node4 555m/1932Mi  node5 361m/1564Mi
          # so a 4-CPU request cannot schedule anywhere, and even the
          # whole node is under 2 CPU.
          #
          # Requests below are sized to fit on ALL FIVE nodes, so the
          # pod can still be rescheduled if one drains. They are
          # scheduling reservations, not a cap.
          #
          # The real work happens through the limits: no CPU limit at
          # all, so thornode bursts into whatever the node has idle
          # (those 71-86% figures are *requests*, not usage -- actual
          # idle CPU is usually much higher). Memory is capped at 3Gi,
          # which v1 demonstrably survived for 61 minutes with zero
          # OOMKills.
          #
          # Honest expectation: this may sync slowly, or OOM once block
          # execution gets heavy. Watch for OOMKilled restarts and a
          # height that climbs. If it OOMs, there is no manifest fix --
          # it needs a bigger node.
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              memory: "3Gi"
              # NO cpu limit, on purpose. CFS throttling on a CometBFT
              # node delays block execution past consensus timeouts and
              # is a classic cause of a node that "runs but falls
              # behind". Without a limit it uses whatever is spare.

          # Probes hit CometBFT's own /health. v1 probed the TCP p2p
          # port, which stays open on a node that is completely stuck
          # -- so the probes reported healthy the entire time the
          # chain was frozen.
          startupProbe:
            httpGet: { path: /health, port: rpc }
            periodSeconds: 15
            failureThreshold: 240      # up to 60 min for replay/handshake
          readinessProbe:
            httpGet: { path: /health, port: rpc }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          # HEIGHT-PROGRESS liveness probe.
          #
          # There was no liveness probe here originally, on the
          # reasoning that restarting a node which is merely BEHIND
          # does not help it catch up. That is still true -- but it
          # left a node which is STALLED with nothing to recover it,
          # and CometBFT's blocksync reactor stalls in practice: this
          # node hung twice in four days, each time with healthy peers,
          # correct app hashes, 45m CPU and 1.6Gi of 3Gi in use. It
          # simply stopped requesting the next block.
          #
          # So the probe checks PROGRESS, not liveness of a socket.
          # v1's tcpSocket-on-p2p probe stayed green through a 5-day
          # freeze because the listener never closed; this cannot.
          #
          # It restarts only when the height has not moved across three
          # consecutive 10-minute checks -- a 30-minute stall. While
          # catching up the node does ~21 blocks/min, so a false
          # positive is not plausible. If a very long LevelDB
          # compaction ever trips it, raise failureThreshold rather
          # than deleting the probe.
          #
          # /tmp is writable by UID 1025 and is emptyDir-free (container
          # filesystem), so the counter resets naturally on restart.
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  H=$(curl -s --max-time 10 http://localhost:27147/status \
                      | jq -r .result.sync_info.latest_block_height)
                  P=$(cat /tmp/last_height 2>/dev/null || echo 0)
                  echo "$H" > /tmp/last_height
                  [ -n "$H" ] && [ "$H" != "null" ] && [ "$H" -gt "$P" ]
            initialDelaySeconds: 1800
            periodSeconds: 600
            timeoutSeconds: 20
            failureThreshold: 3

          volumeMounts:
            - { name: thornode-data, mountPath: /data }
            - { name: passwd-vol,    mountPath: /etc/passwd, subPath: passwd }

      volumes:
        - name: thornode-data
          persistentVolumeClaim:
            claimName: thornode-data
        - name: passwd-vol
          emptyDir: {}
        - name: scripts
          configMap:
            name: thornode-scripts
            defaultMode: 0755
